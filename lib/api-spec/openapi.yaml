openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: InsurRouter API - Two-wheeler insurance application routing engine
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: providers
    description: Insurance provider management
  - name: applications
    description: Insurance application management
  - name: dashboard
    description: Dashboard analytics and summaries
  - name: auth
    description: Sign-in and sessions
  - name: ingest
    description: Document ingestion and MSA payload extraction (VeloDocs)
  - name: dms
    description: DDMS — DMS mirror, owner worklist and reconciliation

# Every operation requires the service key except /healthz, which overrides this
# with `security: []`. The key identifies a calling *process*, not a user, so it
# cannot enforce owner scoping — see lib/auth.ts in the api-server.
security:
  - serviceKey: []

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: >
        Returns server health status. Deliberately unauthenticated: a platform
        that cannot probe liveness will restart a healthy service, and the
        response carries nothing worth protecting.
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Providers ──────────────────────────────────────────────────────────────
  /providers:
    get:
      operationId: listProviders
      tags: [providers]
      summary: List all insurance providers
      responses:
        "200":
          description: List of providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Provider"
    post:
      operationId: createProvider
      tags: [providers]
      summary: Create a new insurance provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /providers/{id}:
    get:
      operationId: getProvider
      tags: [providers]
      summary: Get a provider by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Provider detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProvider
      tags: [providers]
      summary: Update a provider
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderUpdate"
      responses:
        "200":
          description: Updated provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProvider
      tags: [providers]
      summary: Delete a provider
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Applications ────────────────────────────────────────────────────────────
  /applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List all insurance applications
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, validating, pending_confirmation, submitting, completed, failed]
        - name: providerId
          in: query
          required: false
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
    post:
      operationId: createApplication
      tags: [applications]
      summary: Create a new insurance application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /applications/{id}:
    get:
      operationId: getApplication
      tags: [applications]
      summary: Get application with full MSA payload and logs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Application detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateApplication
      tags: [applications]
      summary: Update application data
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteApplication
      tags: [applications]
      summary: Delete an application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /applications/{id}/validate:
    post:
      operationId: validateApplication
      tags: [applications]
      summary: Validate the MSA payload strictly before submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /applications/{id}/execute:
    post:
      operationId: executeApplication
      tags: [applications]
      summary: Execute the insurance application submission (API or Browser mode)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutionRequest"
      responses:
        "200":
          description: Execution started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionResult"
        "400":
          description: Validation/state error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /applications/{id}/logs:
    get:
      operationId: getApplicationLogs
      tags: [applications]
      summary: Get submission execution logs for an application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Execution log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubmissionLog"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /applications/{id}/policy:
    get:
      operationId: getPolicy
      tags: [applications]
      summary: Get the generated policy for a completed application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Policy details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Sessions ────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in and receive a session cookie
      description: >
        Sets an httpOnly session cookie. The service key still applies — it says
        the request came from one of our front ends — but the session is what
        says whose data may be read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              # Named, not inline. An inline request body makes orval emit
              # `<Operation>Body` into both the zod and the types barrels, and
              # the re-export collides — the same trap as `<Operation>Params`
              # documented on /dms/worklist. Every request body here is a $ref
              # for that reason.
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: Wrong details, or the account is deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the session
      responses:
        "204":
          description: Signed out

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Who the session belongs to
      description: >
        The console calls this on load to decide whether to show the sign-in
        screen. 401 is a normal answer here, not a fault.
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── DDMS: mirror, worklist, reconciliation ──────────────────────────────────
  /dms/showrooms:
    get:
      operationId: listShowrooms
      tags: [dms]
      summary: Showrooms the owner holds, with their DMS accounts
      description: >
        Drives the showroom picker on the owner console. Returns inactive
        showrooms too, marked as such, because an owner who has parked an outlet
        still needs to see it exists — silently hiding it looks like data loss.
      responses:
        "200":
          description: Showrooms, ordered by owner then code
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShowroomSummary"

  /dms/showrooms/{showroomId}/sync:
    post:
      operationId: syncShowroomDms
      tags: [dms]
      summary: Pull a showroom's deals from its DMS into the local mirror
      description: >
        Read-only. Walks every active DMS account on the showroom and upserts
        each deal. Only fetches a full record when the summary shows something
        moved, so a routine sync on a quiet day is one list call.
      parameters:
        - name: showroomId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: One result per DMS account synced
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/DmsSyncResult"
                  jobCardResults:
                    type: array
                    description: >
                      The workshop pass. Both modules refresh together — a sync
                      that left one stale would put numbers from two different
                      times on one screen with nothing saying which.
                    items:
                      $ref: "#/components/schemas/DmsSyncResult"
                required: [results]
        "404":
          description: No such showroom, or it has no active DMS account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: DMS unreachable or not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/showrooms/{showroomId}/panel:
    get:
      operationId: getShowroomPanel
      tags: [dms]
      summary: The insurers this showroom can actually place business with
      description: >
        Joins the global `providers` list (how we reach an insurer) to the
        dealer's own arrangement with them (quota, payout, turnaround). Quota
        and eligibility are computed by the shared quoting module, so the rules
        are identical to the ones the dealer portal applies.
      parameters:
        - name: showroomId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Panel entries, by dealer code then insurer
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/PanelEntry"
                required: [entries]
        "404":
          description: No such showroom
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/deals/{dealId}/start-application:
    post:
      operationId: startApplicationFromDeal
      tags: [dms]
      summary: Start an insurance application from a worklist row
      description: >
        The first action in DDMS, and the point at which it stops being a
        report. Everything the pipeline needs is already in the dealer's system,
        so pull, translate, resolve the owner and create the draft all happen
        server-side rather than making the browser orchestrate two calls and
        hold a customer's KYC in between.

        422 rather than 400 when the DMS record is incomplete: the request was
        well formed, the dealership simply never captured the field. Retrying
        will not help — a human has to supply it.
      parameters:
        - name: dealId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Draft application created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestPushResult"
        "404":
          description: No such deal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: This deal already has an application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateDealError"
        "422":
          description: The DMS record is missing details the proposal requires
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncompleteDealError"
        "503":
          description: DMS unreachable or not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/worklist:
    get:
      operationId: getShowroomWorklist
      tags: [dms]
      summary: Every mirrored deal with its DMS-versus-DDMS reconciliation
      description: >
        The owner's console. Each row carries the dealer system's view and ours
        side by side, plus how they differ and the single action that would
        close the gap. Reconciliation is computed on read, never stored, so it
        cannot go stale.

        Reads only the mirror and never calls the DMS, so the console still
        renders when the dealer's ERP is busy or down.

        `showroomId` is a query parameter rather than a path segment on purpose.
        Orval emits `<Operation>Params` for path parameters *and* for query
        parameters, so an operation carrying both produces the same exported
        name twice and the api-zod barrel fails to compile. `listApplications`
        already follows this query-only shape for the same reason — do not
        "tidy" it into /dms/showrooms/{id}/worklist without checking codegen.
      parameters:
        - name: showroomId
          in: query
          required: true
          schema:
            type: integer
        - name: status
          in: query
          required: false
          description: Filter on the DMS status, e.g. AWAITING_INSURANCE
          schema:
            type: string
        - name: includeDisappeared
          in: query
          required: false
          description: Include deals the DMS has stopped listing. Off by default.
          schema:
            type: boolean
      responses:
        "200":
          description: Worklist rows plus a summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    $ref: "#/components/schemas/WorklistSummary"
                  rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorklistRow"
                required: [summary, rows]
        "404":
          description: No such showroom
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/service-worklist:
    get:
      operationId: getServiceWorklist
      tags: [dms]
      summary: The workshop's open work, and what each job card needs from a human
      description: >
        The second instance of the mirror pattern. Where the deal worklist
        reconciles a policy number that either matches or does not, this asks
        whether the promise is being kept and whether anyone told the customer —
        the second of which no DMS records, because telling someone is not a
        workshop event.

        Query parameter rather than a path segment, for the orval reason
        documented on /dms/worklist.
      parameters:
        - name: showroomId
          in: query
          required: true
          schema:
            type: integer
        - name: status
          in: query
          required: false
          description: Filter on the DMS job-card status, e.g. AWAITING_PARTS
          schema:
            type: string
        - name: includeDisappeared
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Job cards plus a summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    $ref: "#/components/schemas/ServiceWorklistSummary"
                  rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/ServiceWorklistRow"
                required: [summary, rows]
        "404":
          description: No such showroom
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/registration-worklist:
    get:
      operationId: getRegistrationWorklist
      tags: [dms]
      summary: Registration files, why each one is stuck, and the certificates nobody collected
      description: >
        The registration desk carries the longest-running open items in a
        dealership and the ones with the most hands in them — the customer, the
        dealer, an RTO agent, the state's tax counter, the RTO itself — so a
        file can stall in six places for six reasons and the DMS records exactly
        one of them: the current status label.

        Two numbers here exist on no screen the dealer has. **Certificates in
        the drawer**: the DMS considers a vehicle finished when the RTO allots a
        number, and whether the customer ever received the card is two fields
        further down a record nothing puts side by side. **Road tax held**:
        collected from the customer at invoice and remitted to the state
        afterwards, with nothing anywhere subtracting the two dates.

        Query parameter rather than a path segment, for the orval reason
        documented on /dms/worklist.
      parameters:
        - name: showroomId
          in: query
          required: true
          schema:
            type: integer
        - name: status
          in: query
          required: false
          description: Filter on the DMS file status, e.g. SUBMITTED
          schema:
            type: string
        - name: includeDisappeared
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Registration files plus a summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    $ref: "#/components/schemas/RegistrationWorklistSummary"
                  rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/RegistrationWorklistRow"
                required: [summary, rows]
        "404":
          description: No such showroom
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/actions:
    post:
      operationId: applyDmsAction
      tags: [dms]
      summary: Record a decision against a mirrored record
      description: >
        One endpoint for every control on every screen, because they all do the
        same thing: write a decision field that already changes a derived state,
        and log who did it.

        Nothing here writes to the dealer's DMS and nothing here calls a model.
        What may be done is knowable, so it is a rule.

        **Every action takes `clear: true` to undo it.** These fields remove work
        from a screen — marking a customer as told takes their row out of the
        calls-to-make count — so an irreversible mis-click would silently delete
        a phone call somebody still needs to make.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DmsActionInput"
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  module: { type: string }
                required: [ok, module]
        "400":
          description: Unknown action, or a required field missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such record for this owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            Refused. The commonest case is assigning work to somebody who has
            left the dealership — the problem these actions exist to fix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/messages:
    post:
      operationId: draftDmsMessage
      tags: [dms]
      summary: Compose a message against a worklist row
      description: >
        Composing is not sending and does not imply it. What comes back is a
        DRAFT, plus the gate's verdict on what would happen if somebody pressed
        send — which for anything addressed to a customer is always "a person has
        to approve this first".

        The template's premise is checked against the row's derived state before
        anything is written. "Your vehicle is ready" sent about a vehicle still in
        the bay is worse than saying nothing at all.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftMessageInput"
      responses:
        "200":
          description: An open draft already existed for this record and was returned unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftMessageResponse"
        "201":
          description: Drafted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftMessageResponse"
        "400":
          description: Unknown template, or a required field missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such record for this owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            The row's state does not support this message — the vehicle is not
            ready, the certificate is not in the drawer, nobody is assigned yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listDmsMessages
      tags: [dms]
      summary: The outbox, with the gate's verdict on every row
      description: >
        The verdict is computed on read rather than stored, for the same reason
        reconciliation is: an approval that was valid when it was written can stop
        being valid once the recipient leaves, and a cached "may send" is exactly
        the stale flag that would let one through.
      parameters:
        - name: showroomId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          description: Comma-separated. DRAFT, APPROVED, SENT, HELD_NO_TRANSPORT, FAILED, CANCELLED.
          schema:
            type: string
      responses:
        "200":
          description: Newest first, capped at 200
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/OutboxRow"
                  summary:
                    $ref: "#/components/schemas/OutboxSummary"
                required: [rows, summary]
        "404":
          description: No such showroom
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/messages/{id}/approve:
    post:
      operationId: approveDmsMessage
      tags: [dms]
      summary: A person takes responsibility for a message
      description: >
        Approving does not send it. Approval is a judgement and sending is an act,
        and collapsing the two turns a mis-click straight into a message somebody
        received.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageNoteInput"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageWithGate"
        "404":
          description: No such message for this owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already sent, or cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/invoice/readiness:
    get:
      operationId: listInvoiceReadiness
      tags: [dms]
      summary: What can be invoiced now, and what is stopping the rest
      description: >
        Every condition is a column test — a chassis against the deal, a price
        list covering the model, nothing issued already. The answer names the
        unmet ones rather than returning a bare yes or no, because "not ready" is
        useless and "no price list covers the Xpulse" is a job somebody can do
        this morning.

        Invoices are not late because typing is hard. They are late because
        nobody noticed the deal became ready.
      parameters:
        - name: showroomId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Ready, blocked, and how many are already issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready:
                    type: array
                    items: { $ref: "#/components/schemas/InvoiceReadiness" }
                  blocked:
                    type: array
                    items: { $ref: "#/components/schemas/InvoiceReadiness" }
                  issued: { type: integer }
                required: [ready, blocked, issued]
        "403":
          description: Not a role that sees what a customer paid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /dms/invoice/generate:
    post:
      operationId: generateSaleDocument
      tags: [dms]
      summary: Issue the document
      description: >
        DDMS's document is the DMS's facts plus the commercial agreement, and
        neither system holds both. The dealer may price from an older list,
        discount ageing stock, or keep the manufacturer's scheme rather than pass
        it on — all three are lawful decisions and the product's job is to
        support and record them, not to have an opinion.

        Which kind of document comes out depends on who holds the tax-invoice
        series (R-90). Where DDMS holds it, a TAX_INVOICE with a number from a
        sequential series. Where the dealer's own system does, a SALE_CONFIRMATION
        that carries their number for linkage and says on its face that it is not
        a tax invoice (R-89).

        A salesman may send QUOTATION and may not send SALE.

        Two shapes, still one door (R-96). dealerCode + dealId invoices a
        mirrored deal; sale invoices a sale somebody typed in, which is the only
        thing available to a dealership with no manufacturer's system behind it.
        Everything after the facts are resolved is the same code either way.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateDocumentInput" }
      responses:
        "201":
          description: Issued, with anything worth saying out loud
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { $ref: "#/components/schemas/SaleDocument" }
                  warnings:
                    type: array
                    items: { type: string }
                    description: >
                      Priced off a superseded list, or no DMS invoice number to
                      reference. Not refusals — the dealer is entitled to both —
                      but not things to leave unsaid either.
                required: [document, warnings]
        "403":
          description: Not a role that may issue this kind of document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "400":
          description: >
            Nothing to price, both shapes sent at once, or - under R-97 - a
            figure a model read reaching a tax invoice before anybody confirmed
            it. The message names the fields and their confidence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such deal at that dealer code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Something has already been issued for this sale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /dms/invoice/documents:
    get:
      operationId: listSaleDocuments
      tags: [dms]
      summary: What has been issued, newest first
      parameters:
        - name: showroomId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items: { $ref: "#/components/schemas/SaleDocument" }
                required: [documents]

  /dms/invoice/documents/{id}:
    get:
      operationId: getSaleDocument
      tags: [dms]
      summary: One document, with everything needed to print it
      description: >
        The generator issued documents from OBJ-25 and there was no way to look
        at one. An invoice a dealership cannot open is an invoice they cannot
        hand to the customer it was raised for, which makes the whole feature a
        row in a list.

        Carries the seller's registered address, which the list deliberately
        does not: it is legally required on the face of a tax invoice, and on a
        list of a hundred it is one dealership's address a hundred times.

        404 rather than 403 across owners — a 403 confirms that somebody else's
        invoice exists.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The document and the identity that issued it
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { $ref: "#/components/schemas/SaleDocument" }
                  notice:
                    type: ["string", "null"]
                    description: >
                      What the customer is told the document is (R-89), computed
                      from this row rather than fixed per kind. It names a linked
                      tax invoice number only when there is one — the first
                      version said "its number is shown above" on documents that
                      had none, which is a false statement on the face of a
                      document. The input-credit sentence appears only for a
                      buyer with a GST number, who is the only reader it can
                      happen to. Null on a tax invoice: it is one, and small
                      print at the top of a genuine tax invoice invites doubt.
                  seller: { $ref: "#/components/schemas/InvoiceSeller" }
                required: [document, seller]
        "403":
          description: Not a role that reads invoices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /dms/invoice/documents/{id}/cancel:
    post:
      operationId: cancelSaleDocument
      tags: [dms]
      summary: Cancel a document, keeping its number
      description: >
        A cancelled tax invoice keeps its number and says it was cancelled. A
        hole in a sequential series is an audit finding, and "we chose not to
        issue this" and "nobody ever issued anything" are different facts of
        which only one can be defended later. Same argument as a cancelled
        outbox message staying a row.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentCancelInput" }
      responses:
        "200":
          description: Cancelled, number spent
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { $ref: "#/components/schemas/SaleDocument" }
                required: [document]
        "400":
          description: No reason given
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /dms/invoice/claims:
    get:
      operationId: listOemClaims
      tags: [dms]
      summary: What the manufacturer still owes this dealership
      description: >
        The number nobody currently has, because it lives in two places at once:
        the scheme is the manufacturer's and the decision about passing it on is
        the dealer's, and only DDMS's document holds both.

        The claim is owed on the full scheme whatever the customer was told
        (R-88). A dealer who retained it made a commercial decision and is still
        owed it; an unclaimed scheme is money given away twice.
      responses:
        "200":
          description: Every document carrying a scheme
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OemClaims" }

  /dms/invoice/price-lists:
    get:
      operationId: listPriceLists
      tags: [dms]
      summary: Every list this outlet may price from, current first
      description: >
        The DMS is a current-state system that forgets yesterday's price. DDMS
        keeps the history, because a dealer selling at an older rate is lawful
        and is his decision — and the invoice prints which list it used.
      parameters:
        - name: showroomId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Newest effective date first
          content:
            application/json:
              schema:
                type: object
                properties:
                  lists:
                    type: array
                    items: { $ref: "#/components/schemas/PriceList" }
                required: [lists]

  /dms/ingest/sources:
    get:
      operationId: listIngestSources
      tags: [dms]
      summary: How this outlet is connected, per kind of data
      description: >
        Ingestion varies; completion does not. An outlet may take deals by API,
        stock by a spreadsheet somebody exports on Fridays, and invoices by scan
        — enabled per data type per dealer, because an OEM that exposes stock and
        not deals is the ordinary situation rather than an edge case.

        The freshness each path can honestly claim is different, and the row says
        so rather than showing a sync timestamp that means nothing on a report.
      parameters:
        - name: showroomId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: All seven kinds, defaulted to API where nobody has chosen
          content:
            application/json:
              schema:
                type: object
                properties:
                  sources:
                    type: array
                    items: { $ref: "#/components/schemas/IngestSource" }
                  reportable:
                    type: array
                    items: { type: string }
                    description: >
                      Which data types a report can actually feed today. A
                      picker that offers a path which does nothing is worse
                      than a picker with two entries — the dealership drops the
                      file, nothing happens, and the product has told them a lie
                      with a dropdown.
                required: [sources, reportable]
    put:
      operationId: setIngestSource
      tags: [dms]
      summary: Change how a kind of data arrives
      description: >
        Requires policy.set — the same class of decision as the dealership's own
        thresholds. It changes what the product does with this outlet's data and
        belongs to whoever runs the business, not to whoever happens to be on the
        onboarding call.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngestSourceInput" }
      responses:
        "200":
          description: The outlet, as it now stands
          content:
            application/json:
              schema:
                type: object
                properties:
                  sources:
                    type: array
                    items: { $ref: "#/components/schemas/IngestSource" }
                  reportable:
                    type: array
                    items: { type: string }
                    description: >
                      Which data types a report can actually feed today. A
                      picker that offers a path which does nothing is worse
                      than a picker with two entries — the dealership drops the
                      file, nothing happens, and the product has told them a lie
                      with a dropdown.
                required: [sources, reportable]
        "403":
          description: Not a role that sets what the dealership does
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /dms/ingest/report:
    post:
      operationId: dropIngestReport
      tags: [dms]
      summary: Take in a file the dealer exported from their own system
      description: >
        The commercial argument in one endpoint. If this export's shape has been
        confirmed before, the file is read by column position and NO MODEL IS
        CALLED — usedModel in the response says so, and it is the number this
        objective is measured on. Model cost is per report type per dealer, not
        per row.

        If the shape is new the file is HELD with a proposed mapping, and a
        person is asked what the headings mean. It is not partly imported: an
        import that quietly did nothing because it did not understand the file is
        the worst of the three possible outcomes.

        The body is the file as text. Every DMS export worth taking is comma or
        tab separated, and a parser is not an upload service.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportDropInput" }
      responses:
        "201":
          description: Taken in, or held pending a mapping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportDropResult" }
        "400":
          description: No headings, or no rows beneath them
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: This exact file has already been taken in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /dms/ingest/mappings/{id}/confirm:
    post:
      operationId: confirmIngestMapping
      tags: [dms]
      summary: A person says what the columns mean, once
      description: >
        The only thing that makes a mapping usable. A model proposed it; nothing
        is extracted until somebody here agrees — R-49 applied to onboarding, and
        the reason the scheduler holds select and update on mappings and never
        insert.

        Send the file text back with the confirmation and any batch held on this
        mapping is released, rather than the dealer being told to go and find
        their export again.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MappingConfirmInput" }
      responses:
        "200":
          description: Confirmed, with any held batches released
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MappingConfirmResult" }
        "403":
          description: Not a role that sets what the dealership does
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such mapping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /dms/ingest/batches:
    get:
      operationId: listIngestBatches
      tags: [dms]
      summary: What has been taken in, newest first
      description: >
        The answer to "where did this figure come from", which the API path never
        had to give — a live integration is simply true continuously. A drop
        happened at a moment, from a system in a state, and every row it produced
        inherits that moment.
      parameters:
        - name: showroomId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  batches:
                    type: array
                    items: { $ref: "#/components/schemas/IngestBatch" }
                required: [batches]

  /dms/records/{module}/{recordKey}:
    get:
      operationId: getCaseRecord
      tags: [dms]
      summary: The whole record, every field
      description: >
        The queue says what to do and offers a button. This is the record that
        instruction came from — acting on a conclusion you cannot inspect is a
        thing people do twice and then stop doing.

        Complete rather than curated. Every column appears, labelled where there
        is a label and humanised where there is not, so a field nobody has taught
        this endpoint about is still visible. A value that exists and is
        invisible is the failure being designed against.

        Each field says where it came from: MIRROR is the manufacturer's and is
        never written back, DDMS is what this product concluded, META is sync
        bookkeeping. Only one of those three is anybody's to change here.
      parameters:
        - name: module
          in: path
          required: true
          schema:
            type: string
            enum: [DEAL, JOB_CARD, ENQUIRY, REGISTRATION, PART, RECEIVABLE, VEHICLE]
        - name: recordKey
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Every field on the record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseRecord" }
        "403":
          description: Not a module this role reads
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /dms/records/{module}/{recordKey}/history:
    get:
      operationId: getRecordHistory
      tags: [dms]
      summary: Everything that has happened to this record
      description: >
        Distinct from the activity list, which returns what somebody wrote down.
        This returns what was done as well — the decision log, the derived state
        moving, what was said to the customer and what they said back — and the
        difference is between a note-taking feature and a handover.

        It exists because of staff shortage. When the advisor who has been
        working a record is not in, somebody else picks it up cold and the
        question they have is "has anyone already rung her". Until this endpoint
        that answer was in the database, correctly and with a name against it,
        and on no screen.

        Every entry carries the clock it is on. A record can move in the dealer's
        system on the 2nd, be pulled on the 5th and be noticed on the 5th; one
        merged timestamp reads as "nothing happened for three days", which is
        false in the direction that makes somebody stop chasing.

        It infers nothing. If nobody logged a call it says nobody logged a call,
        rather than reading a sent message as a conversation. And it says how far
        back it can see — a record that predates the dealership's onboarding has
        history in their own system that was never pulled and cannot be invented.
      parameters:
        - name: module
          in: path
          required: true
          schema:
            type: string
            enum: [DEAL, JOB_CARD, ENQUIRY, REGISTRATION, PART, RECEIVABLE, VEHICLE]
        - name: recordKey
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The record's history, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordHistory" }
        "403":
          description: Not a module this role reads
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /dms/records/{module}/{recordKey}/journey:
    get:
      operationId: getRecordJourney
      tags: [dms]
      summary: Where this record's sale has got to
      description: >
        DDMS understands a record. This is the first thing that understands a
        journey — one sale walking through the building, from the invoice to the
        certificate in the customer's hands, across four screens that do not know
        they describe the same vehicle.

        Read-only, deliberately. A journey moves because the world changed, not
        because somebody pressed a button on it, and an endpoint that let a caller
        set a position would be a second way for the record to become untrue.
        Acting happens on the record through POST /dms/actions and the runtime
        notices on its next pass.

        The position and the wait are derived on read, like reconciliation — a
        stored "waiting on the RTO" goes stale the moment the RTO answers. Only
        the arrivals come out of the database, because history does not go stale.
      parameters:
        - name: module
          in: path
          required: true
          schema:
            type: string
            enum: [DEAL, JOB_CARD, ENQUIRY, REGISTRATION, PART, RECEIVABLE, VEHICLE]
        - name: recordKey
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The map, where it is on it, and every arrival
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyTrace"
        "403":
          description: Not a module this role reads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: This record is not tracked as a journey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/records/{module}/{recordKey}/activities:
    get:
      operationId: listRecordActivities
      tags: [dms]
      summary: A record's own timeline
      description: >
        The first thing DDMS holds that no DMS has a field for. Everything else on
        a record is either the dealer's data or a decision field hung off it; this
        is the dealership's own account of what happened.

        Gated twice. The permission table says whether this principal may read
        activities at all; the row policy says which records, using the same
        app.can_read(module) that gates the mirror row itself.
      parameters:
        - name: module
          in: path
          required: true
          schema:
            type: string
            enum: [DEAL, JOB_CARD, ENQUIRY, REGISTRATION, PART, RECEIVABLE, VEHICLE]
        - name: recordKey
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Newest first, capped at 200
          content:
            application/json:
              schema:
                type: object
                properties:
                  activities:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecordActivity"
                required: [activities]
        "403":
          description: Not a module this role reads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: writeRecordActivity
      tags: [dms]
      summary: Add to a record's timeline
      description: >
        An agent may record what the agent did; it may never record what a person
        did. CALL, VISIT and MESSAGE describe human acts and are refused to a
        non-human caller — the closed set an agent may write is OBSERVED and
        SYSTEM, and that is the rule which makes owning records safe.

        A person writing SYSTEM is recorded as NOTE rather than refused. People do
        notice things; the distinction being kept is who noticed, not whether they
        were allowed to.
      parameters:
        - name: module
          in: path
          required: true
          schema:
            type: string
            enum: [DEAL, JOB_CARD, ENQUIRY, REGISTRATION, PART, RECEIVABLE, VEHICLE]
        - name: recordKey
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityInput"
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  activity:
                    $ref: "#/components/schemas/RecordActivity"
                required: [activity]
        "400":
          description: Empty, or longer than a timeline entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a module this role writes about, or a kind this principal may not claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/activities/{id}/retract:
    post:
      operationId: retractRecordActivity
      tags: [dms]
      summary: Withdraw a claim without erasing that it was made
      description: >
        The row stays, struck through, with who withdrew it and why. "We decided
        this was wrong" and "it never happened" are different facts about a
        dealership and only one of them is defensible — the same argument as
        cancelling a message rather than deleting it.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityRetractInput"
      responses:
        "200":
          description: Withdrawn
          content:
            application/json:
              schema:
                type: object
                properties:
                  activity:
                    $ref: "#/components/schemas/RecordActivity"
                required: [activity]
        "400":
          description: Already withdrawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such activity for this owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/tasks:
    post:
      operationId: createDmsTask
      tags: [dms]
      summary: Work somebody decided needs doing
      description: >
        As opposed to work the product noticed. Every row on the queue until now
        was derived — computed from the mirror on every request, never stored. A
        task is true because a person or a journey said so.

        There is deliberately no list endpoint. Open tasks arrive on
        GET /dms/queue alongside everything else, because a second list recreates
        the problem the queue was built to remove.

        The assignee must still work here — the same check the reassignment
        actions make. A task on a departed employee's list is a task nobody will
        do, which is the failure the queue's middle band exists to surface.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Raised
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: "#/components/schemas/Task"
                required: [task]
        "400":
          description: No title, a bad due date, or an assignee who has left
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such showroom or employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/tasks/{id}/close:
    post:
      operationId: closeDmsTask
      tags: [dms]
      summary: Done, or decided against
      description: >
        The agent does not hold this permission. Closing a task asserts the work
        was done, and whether it was is a fact only the person who did it holds —
        the same reasoning that keeps eight registry actions closed to it.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCloseInput"
      responses:
        "200":
          description: Closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: "#/components/schemas/Task"
                required: [task]
        "400":
          description: Already closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such task for this owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/messages/{id}/edit:
    post:
      operationId: editDmsMessage
      tags: [dms]
      summary: A person writes their own sentence into a draft
      description: >
        The Outbox shipped with no editing, because a rewrite check exists to stop
        a model inventing a figure the facts do not support. That check is still
        right and it is not this case: a named manager adding "Mr Verma is coming
        in on Saturday, please have the file ready" is asserting something only
        they know, and there is nothing in the mirror to check it against.

        What editing does to the gate matters more than what it does to the text.
        An edited message can never take the rule path again, so an internal
        notification a rule would have sent unattended now waits for the person
        who edited it to approve it. The composed text is kept alongside, written
        once, so what the product proposed and what the dealership said are both
        answerable later.

        DRAFT only. Approval means somebody read it as it stood.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageEditInput"
      responses:
        "200":
          description: >
            Edited, with the gate re-evaluated. Expect ok false on a message a
            rule would have sent before the edit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageWithGate"
        "400":
          description: Empty, or longer than a message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such message for this owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Not a draft — approved, sent, cancelled or held
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/messages/{id}/cancel:
    post:
      operationId: cancelDmsMessage
      tags: [dms]
      summary: Decided against
      description: >
        Kept as a row rather than deleted. "We chose not to contact this customer"
        and "nobody ever drafted anything" are different facts about a dealership,
        and only one of them can be defended later.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageNoteInput"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    $ref: "#/components/schemas/OutboundMessage"
                required: [message]
        "404":
          description: No such message for this owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/messages/{id}/send:
    post:
      operationId: sendDmsMessage
      tags: [dms]
      summary: Send it, if it may go
      description: >
        The gate. Nothing leaves without either a rule permitting it or a person
        approving it, and this is the only endpoint that can set sentAt.

        409 with the reason when it may not, and the reason is the useful part: a
        customer message nobody approved, a recipient who has left, a file that is
        no longer theirs.

        A message that is authorised but has no configured transport comes back
        HELD_NO_TRANSPORT with sentAt still null. There is no SMTP credential and
        no WhatsApp Business account, so nothing is delivered to anybody — and
        showing a green "sent" for something no customer received would be the
        same defect as a simulated policy number that looks issued.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Authorised. Check status — SENT, HELD_NO_TRANSPORT or FAILED.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    $ref: "#/components/schemas/OutboundMessage"
                required: [message]
        "404":
          description: No such message for this owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Refused. The body carries the reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/explain:
    post:
      operationId: explainDmsRecord
      tags: [dms]
      summary: Why is this stuck, who else is affected, what happens if it waits
      description: >
        The three questions every worklist row raises and none of them can
        answer, because each reaches across a boundary the dealer's own system
        keys everything by — another module, another outlet, another person's
        workload.

        The answer arrives with its evidence attached. `findings` is one
        sentence per claim, each assembled by a rule from one of the `evidence`
        rows. `summary` is a model's reading of those findings, present only
        when one passed a check that every figure in it appears in the evidence.
        The findings are returned either way: the traceable form of an answer is
        not the part to drop when a nicer-sounding one exists.

        Nothing here classifies. The `state` comes from the module's own
        derivation and travels through untouched, and no tool in the registry
        writes anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExplainInput"
      responses:
        "200":
          description: The explanation, and the rows it came from
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Explanation"
        "400":
          description: Unknown module, or a required field missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such record at a showroom this owner holds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/receivables-worklist:
    get:
      operationId: getReceivablesWorklist
      tags: [dms]
      summary: What the dealership is owed, with the group's exposure attached
      description: >
        Rows are scoped to the outlet on screen. `groupExposure` is not — it is
        computed across every outlet the session's owner holds, and it is present
        only when a party owes at more than one of them.

        That figure is the module's reason for existing. A DMS keys the ledger to
        a dealer code, so an owner with two outlets gets two ageing reports and no
        way to ask what one insurer owes the group.
      parameters:
        - name: showroomId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Every receivable at this outlet, derived on read
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    $ref: "#/components/schemas/ReceivablesWorklistSummary"
                  rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReceivablesWorklistRow"
                required: [summary, rows]
        "404":
          description: No such showroom
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/inventory-worklist:
    get:
      operationId: getInventoryWorklist
      tags: [dms]
      summary: The floor, aged — and matched against the people asking for it
      description: >
        `matchingEnquiries` is the finding: an open enquiry, at any outlet the
        owner holds, for the exact model standing unsold on this floor. The stock
        screen cannot see the CRM and the CRM cannot see the floor, so both
        systems work correctly and the customer goes elsewhere.

        `interestPerDay` and `interestAccrued` are arithmetic over cost, rate and
        days on the floor. Nobody at a dealership disputes the sum; they have
        simply never seen it attached to a specific chassis.
      parameters:
        - name: showroomId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Every unit at this outlet, derived on read
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    $ref: "#/components/schemas/InventoryWorklistSummary"
                  rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/InventoryWorklistRow"
                required: [summary, rows]
        "404":
          description: No such showroom
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/events:
    get:
      operationId: listDmsEvents
      tags: [dms]
      summary: What has moved, and what it moved from
      description: >
        The log of derived-state transitions. Every other endpoint answers what
        is true now; this answers what changed and when, which is a different
        question and the one a rule is triggered by.

        Events are the classifier's answer moving, not a column changing —
        the Platform-Events reading rather than Change-Data-Capture. That also
        catches transitions no field diff could: a lead breaching its window, a
        chase going stale, a temporary registration lapsing. Nothing in the
        dealer's system changed; the answer did.

        `fromState` null means the record was classified for the first time,
        which is a different fact from a record moving and is kept distinct so
        each rule can decide whether it cares.

        The newest row for a record is, by construction, its current state.
      parameters:
        - name: showroomId
          in: query
          required: false
          schema:
            type: integer
        - name: module
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EventModule"
        - name: recordKey
          in: query
          required: false
          description: The mirror row's own key. What a timeline on one record reads.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Default 100, capped at 500.
          schema:
            type: integer
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecordEvent"
                required: [rows]
        "400":
          description: Unknown module, or a malformed showroomId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such showroom
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/ledger/accounts:
    get:
      operationId: listLedgerAccounts
      tags: [dms]
      summary: The dealership's chart of accounts
      description: >
        Shaped like Tally's, because that is where the numbers are going. R-98
        says the ledger is a feeder before it is a book of record — it produces
        vouchers for whatever the dealership already keeps — and a chart
        invented from first principles would be elegant and would not map onto
        the one their accountant has used for eleven years.

        `isSystem` marks the accounts a posting rule names by code. Those may be
        renamed and remapped and may not be deleted: a rule that cannot find its
        account has no honest behaviour left, because posting to a substitute
        misstates the books silently and skipping the line produces a voucher
        that does not balance.
      responses:
        "200":
          description: Every account, by code
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items: { $ref: "#/components/schemas/LedgerAccount" }
                required: [accounts]
        "403":
          description: This role may not read the ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/ledger/accounts/{code}:
    put:
      operationId: renameLedgerAccount
      tags: [dms]
      summary: Point an account at the name their own books use
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LedgerAccountPatch"
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema:
                type: object
                properties:
                  account: { $ref: "#/components/schemas/LedgerAccount" }
                required: [account]
        "404":
          description: No such account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/ledger/post:
    post:
      operationId: postToLedger
      tags: [dms]
      summary: Post an issued sale document as double entry
      description: >
        The input is a `sale_document`, not a PDF. DDMS already produces the
        invoice; the ledger posts what DDMS issued, so there is exactly one
        thing to post from.

        Two things it refuses to guess. A charge whose label nothing recognises
        goes to **suspense, never to income** — the failure R-103 is written
        against is overstating turnover, so the default has to fall the other
        way. And a vehicle that cannot be found in stock gets **no invented
        cost**: the revenue posts, the cost relief does not, and the warning
        says that until it does the whole selling price reads as margin.

        `warnings` is part of a successful response. Refusing the posting would
        deny a sale that happened; making the gap loud is the honest version.

        One document posts once (R-101). A second attempt answers 409 — a
        corrected invoice is reversed and re-issued, never edited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostToLedgerInput"
      responses:
        "200":
          description: Posted, possibly with warnings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostedVoucher"
        "409":
          description: Already posted, not issued, or it does not balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/ledger/vouchers:
    get:
      operationId: listVouchers
      tags: [dms]
      summary: The books, newest first
      responses:
        "200":
          description: Vouchers with their lines
          content:
            application/json:
              schema:
                type: object
                properties:
                  vouchers:
                    type: array
                    items: { $ref: "#/components/schemas/Voucher" }
                required: [vouchers]
        "403":
          description: This role may not read the ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/ledger/vouchers/{id}/reverse:
    post:
      operationId: reverseVoucher
      tags: [dms]
      summary: Undo an entry by posting its mirror
      description: >
        Never an edit and never a delete. The original stays, marked `REVERSED`,
        and a new voucher carries the same lines with debit and credit swapped.
        A set of books whose entries can be changed after the fact is not
        evidence of anything, and the month it was closed on is already inside
        somebody's return.

        Dated today rather than back-dated to the original. Reversing an April
        entry in September is a September event; back-dating it would silently
        reopen a month that has been filed on.

        A reason is required — a reversal without one is an unexplained hole in
        a set of books, and whoever made it will not remember in March.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReverseVoucherInput"
      responses:
        "200":
          description: The reversing voucher
          content:
            application/json:
              schema:
                type: object
                properties:
                  voucher: { $ref: "#/components/schemas/Voucher" }
                required: [voucher]
        "400":
          description: No reason given
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already reversed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/ledger/gstr1:
    get:
      operationId: getGstr1
      tags: [dms]
      summary: The file the CA files
      description: >
        R-99 — a ledger that produces nothing lodgeable has added a system
        rather than replaced one.

        B2B and B2C are different shapes rather than a flag, because they are
        different filings. A registered buyer's invoice is reported line by
        line, since their input credit depends on it and the portal matches the
        two; everybody else's sales are aggregated by place of supply and rate.
        Getting that wrong does not produce a wrong total — it produces a return
        the portal accepts and a buyer who cannot claim their credit, which the
        dealership hears about three months later.

        Nothing here recomputes tax. The rate and the split were decided when
        the invoice was priced and printed on a document a customer holds; a
        return is not the place to discover the product has two answers.

        `problems` is part of a successful response. A return with three rows
        missing a place of supply is still worth having in front of somebody.
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: string }
          description: "`YYYY-MM`. Returns are monthly."
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [json, csv] }
      responses:
        "200":
          description: The return, or its CSV
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gstr1"
        "400":
          description: Bad period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/ledger/tally:
    get:
      operationId: getTallyFeed
      tags: [dms]
      summary: Vouchers in the shape Tally imports
      description: >
        R-98's first rung — **be additive before asking to be trusted.** This
        does not replace anybody's books: it produces vouchers Tally imports,
        the dealership brings them in beside what they already keep, and the two
        are reconciled for an agreed period. Only then is there a conversation
        about which one is the record.

        `LEDGERNAME` uses each account's `tallyName` where the dealership has
        set one, which is what makes the import land in *their* chart rather
        than in twenty-six new ledgers named after ours.

        Building the file and marking it handed over are two calls on purpose.
        A download that failed halfway would otherwise leave vouchers marked
        exported that nobody received, and the next feed would skip them — which
        is how a month goes missing with nothing anywhere reporting it.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [json, xml] }
        - name: all
          in: query
          required: false
          schema: { type: string }
          description: "`true` to include vouchers already handed over."
      responses:
        "200":
          description: The XML and what is in it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TallyFeed"
        "400":
          description: Bad dates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/ledger/tally/handed-over:
    post:
      operationId: markTallyHandedOver
      tags: [dms]
      summary: Record that a feed actually reached their books
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandedOverInput"
      responses:
        "200":
          description: How many were marked
          content:
            application/json:
              schema:
                type: object
                properties:
                  marked: { type: integer }
                required: [marked]

  /dms/runs:
    get:
      operationId: listRuns
      tags: [dms]
      summary: What ran on its own, what it cost, and whether it stood down
      description: >
        The decision log answers *what happened to this record* and answers it
        well. It cannot answer *what did the agent do at half past two*, because
        a run is a narrative across records — it looked at a hundred and forty,
        suggested eleven, was refused on two and called a model four times — and
        that shape exists in no per-record table. You cannot supervise what you
        cannot watch.

        `costPaise` is an estimate from the provider's own token counts times a
        rate table in code. It is not an invoice, and what it is for is noticing
        that today cost forty times yesterday, and for the daily ceiling.

        `standingDown` is set only while a stand-down is still the newest thing
        that happened. One three days ago followed by six good runs is history,
        not a state, and a banner nothing ever clears is a banner people learn
        to ignore.
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/runs/{id}:
    get:
      operationId: getRun
      tags: [dms]
      summary: One run, step by step
      description: >
        Five kinds of step, closed: READ looked at something, PROPOSE offered a
        value, ACT wrote one, REFUSED was told no and by what, MODEL called a
        model and what it cost. Deliberately not application logging — a steps
        table with a severity column becomes a second logger inside the database
        within a month.

        A step that produced a write **names** its `decision_log` row rather
        than repeating it. The authoritative record of what happened to a record
        stays in one place; two tables telling the story of one write is how
        they come to disagree.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The run and its steps in order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetail"
        "404":
          description: No such run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/channels:
    get:
      operationId: listChannels
      tags: [dms]
      summary: The dealership's own messaging accounts, and whether they work
      description: >
        DDMS holds no WhatsApp number and no mail server of its own. Every
        outside credential belongs to the dealership (R-106), which is what
        makes the number a customer sees theirs, the template approvals theirs
        and the bill theirs.

        No response here can carry a secret. The token is encrypted at rest and
        decrypted by one module-private function on the sending path; a screen
        gets whether the channel is connected, the address customers see, and
        four characters of the secret — enough to tell two tokens apart and
        useless to anybody who only has this.

        `blocker` is one sentence saying why a channel cannot be used yet and
        whose problem it is. *No transport is configured* described a gap in
        the product; three of the four real reasons belong to the dealership.
      responses:
        "200":
          description: One entry per channel, connected or not
          content:
            application/json:
              schema:
                type: object
                properties:
                  channels:
                    type: array
                    items: { $ref: "#/components/schemas/ChannelStatus" }
                required: [channels]
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: connectChannel
      tags: [dms]
      summary: Connect or re-connect an account
      description: >
        Upsert on (owner, channel) — a dealership has one WhatsApp number, and
        re-pasting a rotated token is the ordinary case rather than a second
        account.

        It arrives **switched off every time**, including on a re-paste. A token
        that changed is a token nobody has tested, and the send that proves it
        works is cheaper than the one that goes to four hundred customers from a
        number the dealership had not finished setting up.

        Owner or manager only, on `policy.set` rather than `outbox.send`: being
        allowed to approve one message is a long way from being allowed to
        connect the number every message afterwards goes out on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectChannelInput"
      responses:
        "200":
          description: Saved, and switched off
          content:
            application/json:
              schema:
                type: object
                properties:
                  channels:
                    type: array
                    items: { $ref: "#/components/schemas/ChannelStatus" }
                required: [channels]
        "400":
          description: Missing address or secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an owner or a manager
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: This installation has no CREDENTIAL_KEY and cannot hold a credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/channels/active:
    post:
      operationId: setChannelActive
      tags: [dms]
      summary: Switch a connected account on or off
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelActiveInput"
      responses:
        "200":
          description: The channels, after the change
          content:
            application/json:
              schema:
                type: object
                properties:
                  channels:
                    type: array
                    items: { $ref: "#/components/schemas/ChannelStatus" }
                required: [channels]
        "403":
          description: Not an owner or a manager
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/channels/{channel}:
    delete:
      operationId: disconnectChannel
      tags: [dms]
      summary: Disconnect an account and forget its credential
      description: >
        The row is deleted rather than deactivated, unlike almost everything
        else in this product. Disconnecting is a dealership deciding DDMS may no
        longer speak for them, and keeping an encrypted token after somebody
        pressed Disconnect would be holding a credential they revoked.
      parameters:
        - name: channel
          in: path
          required: true
          schema: { type: string, enum: [WHATSAPP, EMAIL] }
      responses:
        "200":
          description: Gone
          content:
            application/json:
              schema:
                type: object
                properties:
                  channels:
                    type: array
                    items: { $ref: "#/components/schemas/ChannelStatus" }
                required: [channels]
        "403":
          description: Not an owner or a manager
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/replies:
    get:
      operationId: listReplies
      tags: [dms]
      summary: What customers said back that nobody has read
      description: >
        The half of messaging that is not plumbing. A DMS records what the
        dealership did to a record; it has no column for *the customer answered
        on Tuesday*, no report that would produce one, and no way to notice that
        nobody read it.

        Nothing here has read the message. The body is stored verbatim, no rule
        fires on its contents and no model summarises it — a model reading
        "don't bother, I've sold it" and marking a lead lost is the judgement
        R-49 reserves for a person. What a reply produces is a queue row saying
        somebody answered and nobody opened it, which is a fact about the
        dealership rather than a claim about the message.

        `matchBasis` says how the reply was attributed. A thread is something
        DDMS wrote and can point at; a mobile number is probable and no more
        (R-47), and an unmatched reply is kept and shown rather than dropped.
      responses:
        "200":
          description: Unread replies, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  replies:
                    type: array
                    items: { $ref: "#/components/schemas/InboundReply" }
                required: [replies]
        "403":
          description: This role may not read the outbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/replies/{id}/read:
    post:
      operationId: markReplyRead
      tags: [dms]
      summary: Somebody read it
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Marked, with a name and a time against it
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                required: [ok]
        "404":
          description: No such reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/overview:
    get:
      operationId: getDmsOverview
      tags: [dms]
      summary: How the business is doing, without opening a module
      description: >
        The owner's screen, and the second half of what DDMS is: it automates
        the routine tasks and it gives one view of the whole thing. The queue
        answers *what do I do next* for the person doing the work; this answers
        *how is the business doing* for the person who owns it.

        It derives nothing. Every figure is already computed by the seven
        classifiers, the queue's bands, the reconciliation, the outbox gate or
        the ladder's standing — this loops the visible outlets, calls the same
        builders every worklist route calls, and adds up what comes back. A
        dashboard that computes its own version of *overdue* is a second answer
        to a question the product already answers, and the two drift within a
        month.

        Every figure carries an `href` to the rows behind it. A number you
        cannot walk into is a report, and this product is a control panel.

        A module outside the caller's role is left out of the arithmetic and
        named in `scope.withheld`, never counted as zero — four zeroes read as
        *your dealership has none of these*, which is a false claim about
        somebody's own business, and here it would be summed into a headline.

        Nothing is stored. `limits` is derived from the state just read and
        says what this view cannot tell you, including how stale the mirror is
        and whether any message has actually reached a customer.
      responses:
        "200":
          description: Derived on read. Nothing on this response was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewResult"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/queue:
    get:
      operationId: getDmsQueue
      tags: [dms]
      summary: One ordered list of everything waiting on a person
      description: >
        Seven screens each holding a list is a reporting product: it says what
        is wrong and leaves *which of these to do next* to the person with no
        time to decide it. This is the screen that decides, and the capacity
        argument the product is sold on stands or falls on it.

        Three bands, in order — mine, nobody's, my outlet's. The middle one is
        the point: an enquiry assigned to a salesman who left in February is on
        nobody's list, is not late by any measure the DMS holds, and simply
        stops happening. A departed assignee puts an item in that band rather
        than in "somebody else's", because the work is not less orphaned for
        the DMS still carrying the name.

        Contents are the classifiers' answers read through the same builders
        the screens and the event detector use — every record whose own screen
        would show an `actionRequired`, and whose state appears in the severity
        table. Nothing here is a second opinion about which rows matter, and no
        model is involved anywhere: what somebody should do next is exactly the
        decision R-49 says a model may not make.

        Scoped twice. The outlet narrows to the one on the login for a member
        of staff, and the role decides which modules are built at all — so a
        service advisor's queue holds job cards and parts rather than an empty
        ledger section.
      responses:
        "200":
          description: Ordered — band, then severity, then how long it has waited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueResult"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/policy:
    get:
      operationId: getDmsPolicy
      tags: [dms]
      summary: The dealership's own numbers
      description: >
        What comes first on the queue, and when a classifier decides something
        has gone wrong. Both were the product's opinion until OBJ-18, and
        neither is a product question: whether a stuck registration outranks a
        broken payment promise depends on whether this group's RTO agent is
        snowed under or its cash position is tight.

        The key set is closed. A dealership may change what the numbers are and
        can never change what the product does with them, which is the
        difference between configuration and a rule builder — and eighty numbers
        in a table cannot become an automation layer nobody can predict.

        Readable by anybody signed in, because the numbers explain what is on
        their screen. `isDefault` says whether anybody has moved it.
      responses:
        "200":
          description: Every key, with the value in force
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: array
                    items: { $ref: "#/components/schemas/PolicySetting" }
                required: [settings]
    put:
      operationId: setDmsPolicy
      tags: [dms]
      summary: Set one number, or reset it to the product's default
      description: >
        Owner or showroom manager only — the two roles whose judgement covers
        the whole dealership rather than one part of it. Enforced by the row
        policies as well as here.

        `value: null` resets: it deletes the row rather than writing today's
        default, so a dealership that resets keeps following the product's
        default afterwards rather than freezing on whatever it was.

        The change lands in the decision log with the previous value and a
        person's name against it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicySetInput"
      responses:
        "200":
          description: Set
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  key: { type: string }
                  value: { type: integer }
                  previous: { type: integer }
                  isDefault: { type: boolean }
                required: [ok, key, value, previous, isDefault]
        "400":
          description: Unknown key, or a value outside its range
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Not an owner or a showroom manager
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /dms/policy/reset:
    post:
      operationId: resetDmsPolicy
      tags: [dms]
      summary: Put every number back to the product's default
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyResetInput"
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  cleared:
                    type: integer
                    description: How many settings were being overridden.
                required: [cleared]
        "403":
          description: Not an owner or a showroom manager
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /dms/autonomy:
    get:
      operationId: listAutonomy
      tags: [dms]
      summary: What the product has learned, and how far that has earned it
      description: >
        Everyone builds autonomy as a dial somebody sets. This is a count.
        Watching, then recall, then pre-filled, then — only with a person's
        consent on evidence they can read — automatic. Per pattern, with
        demotion, and every threshold belongs to the dealership.

        Readable by anybody signed in, because it explains what is on their
        queue. An automation layer nobody can see is where an automation layer
        nobody can predict begins.
      responses:
        "200":
          description: Every pattern with a standing, loudest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  patterns:
                    type: array
                    items: { $ref: "#/components/schemas/AutonomyPattern" }
                  numbers: { $ref: "#/components/schemas/AutonomyNumbers" }
                  agentSwitchedOn:
                    type: boolean
                    description: >
                      The master switch. Both it and the pattern's rung have to
                      hold before anything runs unattended.
                required: [patterns, numbers, agentSwitchedOn]

  /dms/autonomy/consent:
    post:
      operationId: grantAutonomyConsent
      tags: [dms]
      summary: Allow one pattern to run unattended
      description: >
        The only place a person grants standing permission for something to act
        without them. Owner or manager only, and refused outright for any action
        that asserts a person did something — no amount of precedent promotes
        past the floor (R-80).

        The pattern travels in the body rather than the path because it carries
        colons, and a key that has to be URL-encoded to be named is one somebody
        will eventually encode wrongly.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutonomyConsentInput" }
      responses:
        "201":
          description: Granted
          content:
            application/json:
              schema:
                type: object
                properties:
                  consent: { type: object, additionalProperties: true }
                required: [consent]
        "403":
          description: Not a role that decides how the dealership runs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: This one can never run unattended, however often it is right
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /dms/autonomy/revoke:
    post:
      operationId: revokeAutonomyConsent
      tags: [dms]
      summary: Take it back
      description: >
        Revoked, never deleted — the row keeps who granted it and who took it
        back, the same argument as a cancelled message staying a row.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutonomyRevokeInput" }
      responses:
        "200":
          description: Taken back
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: boolean }
                required: [revoked]
        "403":
          description: Not a role that decides how the dealership runs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Nothing was standing for this one
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /dms/autonomy/proposals:
    get:
      operationId: listAutonomyProposals
      tags: [dms]
      summary: What was offered lately, and what became of each one
      description: >
        The evidence behind a rung, shown rather than summarised. A count
        somebody cannot open is a count they have to take on trust, and this is
        the screen where trust is decided.
      parameters:
        - name: patternKey
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposals:
                    type: array
                    items: { $ref: "#/components/schemas/AutonomyProposal" }
                required: [proposals]

  /dms/rules:
    get:
      operationId: listDmsRules
      tags: [dms]
      summary: What runs itself, in the order it is evaluated
      description: >
        The whole rule set. One ordered list, in code, capped — no rule builder
        and no per-dealership flows, because the failure mode being designed
        against is eighty active flows on one object and an automation layer
        nobody can predict, and DDMS's customer has no administrator to untangle
        one.

        Every rule fires on a record *being in a state* rather than on the
        transition into it, so a missed scheduler pass loses nothing and the
        cadence falls out of the same query. Leaving that state is the goal
        condition: a chase stops because the record moved, not because somebody
        remembered to stop it.

        A rule drafts and presses send; `authoriseSend()` decides what happens
        next, and refuses every customer-facing message without a person.
        Read-only — changing the set is a deployment.
      responses:
        "200":
          description: In evaluation order
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules:
                    type: array
                    items: { $ref: "#/components/schemas/AutomationRule" }
                  max:
                    type: integer
                    description: The ceiling. Import fails if the set exceeds it.
                required: [rules, max]

  /dms/staff:
    get:
      operationId: listShowroomStaff
      tags: [dms]
      summary: Staff who still work at this outlet, and what each already carries
      description: >
        Behind the reassignment pickers. Departed employees are excluded rather
        than greyed out — they are the reason the reassignment field exists, and
        a list containing them invites handing work back to somebody who left in
        February. `carrying` is included because reassigning an orphaned lead to
        whoever is already busiest is a decision DDMS would have made worse.
      parameters:
        - name: showroomId
          in: query
          required: true
          schema:
            type: integer
        - name: role
          in: query
          required: false
          description: e.g. SALES_EXEC, RTO_AGENT, SERVICE_ADVISOR
          schema:
            type: string
      responses:
        "200":
          description: Active staff, least-loaded first
          content:
            application/json:
              schema:
                type: object
                properties:
                  staff:
                    type: array
                    items:
                      $ref: "#/components/schemas/StaffMember"
                required: [staff]
        "404":
          description: No such showroom
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/entities:
    get:
      operationId: searchEntities
      tags: [dms]
      summary: Find a person, a vehicle or a member of staff across every module
      description: >
        Five modules, five islands. Mrs Kavita Sharma is a job card waiting on a
        brake shoe; whether she is also an enquiry nobody rang, or owns the
        vehicle whose certificate has been in a drawer for three weeks, is a
        question no screen in the dealership can put — because a DMS keys
        everything by module and by dealer code.

        Search by whatever somebody has to hand: a phone number, a chassis, a
        registration number, a name. Owner-scoped rather than showroom-scoped,
        which is the point rather than a convenience.
      parameters:
        - name: q
          in: query
          required: true
          description: At least 3 characters. Mobile and chassis match exactly after normalisation; names are a substring match.
          schema:
            type: string
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EntityKind"
      responses:
        "200":
          description: Matching entities, most-connected first
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/EntitySearchRow"
                required: [rows]
        "400":
          description: Query too short
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/entities/{entityId}:
    get:
      operationId: getEntityDossier
      tags: [dms]
      summary: Everything the five mirrors know about one entity
      description: >
        Each record carries the derived state from **its own module's builder**,
        never a second implementation here, so a dossier can never disagree with
        the screen its row came from.
      parameters:
        - name: entityId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The dossier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityDossier"
        "404":
          description: No such entity for this owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/spares-worklist:
    get:
      operationId: getSparesWorklist
      tags: [dms]
      summary: The parts counter, read across every outlet the owner holds
      description: >
        The only DDMS read that deliberately looks outside the showroom in the
        query string, and the reason is the product's whole premise. A DMS keeps
        the stock ledger against a dealer code, because a dealer code is what it
        thinks a business is. An owner with three outlets gets three ledgers and
        no way to ask whether the part a customer has been waiting three days
        for is on a shelf in the next branch.

        The cross-branch scope comes from the session, never from the request,
        so widening the read cannot widen it past the owner. Row-level security
        is the backstop underneath that.
      parameters:
        - name: showroomId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Part lines for this outlet, plus a summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    $ref: "#/components/schemas/SparesWorklistSummary"
                  rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/SparesWorklistRow"
                required: [summary, rows]
        "404":
          description: No such showroom
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dms/lead-worklist:
    get:
      operationId: getLeadWorklist
      tags: [dms]
      summary: Enquiries, the manufacturer response clock, and leads with no owner
      description: >
        The CRM mirror. Two things here appear on no screen the dealer has: how
        many minutes are left on a manufacturer-generated lead's response window
        — the industry mandate is thirty, and future lead allocation depends on
        it — and which live enquiries are assigned to somebody who has left.

        The second needs the enquiry mirror joined to the staff mirror. The
        dealer's CRM knows the assignment and their HR records know the leaving
        date; neither knows both.
      parameters:
        - name: showroomId
          in: query
          required: true
          schema:
            type: integer
        - name: stage
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Enquiries plus a summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    $ref: "#/components/schemas/LeadWorklistSummary"
                  rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/LeadWorklistRow"
                required: [summary, rows]
        "404":
          description: No such showroom
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Ingest ──────────────────────────────────────────────────────────────────
  /ingest/dms-pull:
    post:
      operationId: ingestDmsPull
      tags: [ingest]
      summary: Pull deal, vehicle and customer data from the dealer's DMS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DmsPullInput"
      responses:
        "200":
          description: Extracted MSA fields with confidence scores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ingest/browser-scrape:
    post:
      operationId: ingestBrowserScrape
      tags: [ingest]
      summary: Scrape vehicle data from a dealer portal URL using Playwright
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserScrapeInput"
      responses:
        "200":
          description: Extracted MSA fields with confidence scores and raw text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ingest/ocr:
    post:
      operationId: ingestOcr
      tags: [ingest]
      summary: Extract vehicle data from an RC book image or dealer invoice PDF via OCR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OcrInput"
      responses:
        "200":
          description: Extracted MSA fields with confidence scores and raw text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ingest/ocr/engines:
    get:
      operationId: listOcrEngines
      tags: [ingest]
      summary: List OCR engines with live availability and configured priority
      responses:
        "200":
          description: Engine status, ordered by priority
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OcrEngineStatus"
    put:
      operationId: updateOcrEngines
      tags: [ingest]
      summary: Set OCR engine priority order and enabled state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOcrEnginesInput"
      responses:
        "200":
          description: Updated engine status, ordered by priority
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OcrEngineStatus"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ingest/push:
    post:
      operationId: ingestPush
      tags: [ingest]
      summary: Push corrected MSA payload to InsurRouter as a draft application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestPushInput"
      responses:
        "201":
          description: Draft application created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestPushResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: This DMS deal already has an application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateDealError"

  # ── Dashboard ───────────────────────────────────────────────────────────────
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get aggregated stats for the dashboard
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/recent:
    get:
      operationId: getRecentApplications
      tags: [dashboard]
      summary: Get the most recent 10 applications with provider name
      responses:
        "200":
          description: Recent applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecentApplication"

components:
  securitySchemes:
    serviceKey:
      type: apiKey
      in: header
      name: x-api-key
      description: >
        Shared secret proving the caller is one of our own processes. The
        api-server also accepts it as `Authorization: Bearer <key>`; both are
        the same credential.

        The two web frontends never hold it — each Vite dev server injects the
        header into its `/api` proxy, so it stays in Node and out of the bundle.

        It authenticates a process, not a person. Which showroom is asking still
        arrives in the request rather than being derived from a session, so this
        does not yet enforce the owner scoping the schema is shaped for.

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    IncompleteDealError:
      type: object
      description: >
        The dealer's record does not carry everything an insurance proposal
        needs. Names the fields so the console can send someone to fill them in
        rather than reporting a generic failure.
      properties:
        error:
          type: string
        errors:
          type: array
          items: { type: string }
        invalidFields:
          type: array
          items: { type: string }
        gaps:
          type: array
          description: >
            What the adapter already knew was missing from the DMS record,
            phrased for a person. Usually the same story as invalidFields, from
            the other end.
          items: { type: string }
      required: [error, errors, invalidFields]

    DuplicateDealError:
      type: object
      description: >
        This DMS deal already has an application. The existing id is returned
        rather than only an error, because the caller almost always wants to
        open that draft — creating a second one would eventually mean two
        policies on one vehicle.
      properties:
        error:
          type: string
        applicationId:
          type: number
          nullable: true
        status:
          type: string
      required:
        - error
        - applicationId

    # ── Provider schemas ────────────────────────────────────────────────────
    Provider:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        code:
          type: string
          description: Short unique code, e.g. "HDFC", "BAJAJ"
        defaultExecutionMode:
          type: string
          enum: [API, BROWSER, AUTO]
        apiEndpoint:
          type: ["string", "null"]
          description: REST endpoint for API mode (null if not available)
        portalUrl:
          type: ["string", "null"]
          description: Dealer portal URL for browser automation mode
        isActive:
          type: boolean
        logoColor:
          type: ["string", "null"]
          description: Brand color hex for UI display
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - code
        - defaultExecutionMode
        - apiEndpoint
        - portalUrl
        - isActive
        - logoColor
        - createdAt
        - updatedAt

    ProviderInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 1
        defaultExecutionMode:
          type: string
          enum: [API, BROWSER, AUTO]
        apiEndpoint:
          type: ["string", "null"]
        portalUrl:
          type: ["string", "null"]
        isActive:
          type: boolean
        logoColor:
          type: ["string", "null"]
      required:
        - name
        - code
        - defaultExecutionMode

    ProviderUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 1
        defaultExecutionMode:
          type: string
          enum: [API, BROWSER, AUTO]
        apiEndpoint:
          type: ["string", "null"]
        portalUrl:
          type: ["string", "null"]
        isActive:
          type: boolean
        logoColor:
          type: ["string", "null"]

    # ── Application schemas ─────────────────────────────────────────────────
    VehicleDetails:
      type: object
      properties:
        make:
          type: string
        model:
          type: string
        variant:
          type: string
        engineNumber:
          type: string
        chassisNumber:
          type: string
        exShowroomPrice:
          type: number
        dateOfPurchase:
          type: string
          format: date
      required:
        - make
        - model
        - variant
        - engineNumber
        - chassisNumber
        - exShowroomPrice
        - dateOfPurchase

    OwnerKyc:
      type: object
      properties:
        fullName:
          type: string
        billingAddress:
          type: string
        pincode:
          type: number
        phoneNumber:
          type: number
        email:
          type: string
          
        dateOfBirth:
          type: string
          format: date
        idProofType:
          type: string
          enum: [AADHAR, PAN, PASSPORT, DRIVING_LICENSE, VOTER_ID]
        idProofNumber:
          type: string
      required:
        - fullName
        - billingAddress
        - pincode
        - phoneNumber
        - email
        - dateOfBirth
        - idProofType
        - idProofNumber

    RtoDetails:
      type: object
      properties:
        registrationCity:
          type: string
        registrationState:
          type: string
        rtoCode:
          type: string
      required:
        - registrationCity
        - registrationState
        - rtoCode

    Application:
      type: object
      properties:
        id:
          type: number
        status:
          type: string
          enum: [draft, validating, pending_confirmation, submitting, completed, failed]
        executionMode:
          type: string
          enum: [API, BROWSER, AUTO]
        resolvedExecutionMode:
          type: ["string", "null"]
          enum: [API, BROWSER, null]
        providerId:
          type: ["integer", "null"]
        providerName:
          type: ["string", "null"]
        vehicleMake:
          type: string
        vehicleModel:
          type: string
        ownerName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - status
        - executionMode
        - resolvedExecutionMode
        - providerId
        - providerName
        - vehicleMake
        - vehicleModel
        - ownerName
        - createdAt
        - updatedAt

    ApplicationDetail:
      type: object
      properties:
        id:
          type: number
        status:
          type: string
          enum: [draft, validating, pending_confirmation, submitting, completed, failed]
        executionMode:
          type: string
          enum: [API, BROWSER, AUTO]
        resolvedExecutionMode:
          type: ["string", "null"]
          enum: [API, BROWSER, null]
        providerId:
          type: ["integer", "null"]
        providerName:
          type: ["string", "null"]
        vehicleDetails:
          $ref: "#/components/schemas/VehicleDetails"
        ownerKyc:
          $ref: "#/components/schemas/OwnerKyc"
        rtoDetails:
          $ref: "#/components/schemas/RtoDetails"
        validationErrors:
          type: ["array", "null"]
          items:
            type: string
        logs:
          type: array
          items:
            $ref: "#/components/schemas/SubmissionLog"
        policy:
          oneOf:
            - $ref: "#/components/schemas/Policy"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - status
        - executionMode
        - resolvedExecutionMode
        - providerId
        - providerName
        - vehicleDetails
        - ownerKyc
        - rtoDetails
        - validationErrors
        - logs
        - policy
        - createdAt
        - updatedAt

    ApplicationInput:
      type: object
      properties:
        showroomId:
          type: ["integer", "null"]
          description: >-
            Which outlet this application belongs to, and therefore which owner.
            Only needed when the signed-in person works across more than one
            outlet: a member of staff has exactly one, and an owner holding a
            single showroom has no ambiguity to resolve. Rejected with a 404 —
            never a 403 — if it is not one of the session's own.
        providerId:
          type: ["integer", "null"]
        executionMode:
          type: string
          enum: [API, BROWSER, AUTO]
        vehicleDetails:
          $ref: "#/components/schemas/VehicleDetails"
        ownerKyc:
          $ref: "#/components/schemas/OwnerKyc"
        rtoDetails:
          $ref: "#/components/schemas/RtoDetails"
      required:
        - executionMode
        - vehicleDetails
        - ownerKyc
        - rtoDetails

    ApplicationUpdate:
      type: object
      properties:
        providerId:
          type: ["integer", "null"]
        executionMode:
          type: string
          enum: [API, BROWSER, AUTO]
        vehicleDetails:
          $ref: "#/components/schemas/VehicleDetails"
        ownerKyc:
          $ref: "#/components/schemas/OwnerKyc"
        rtoDetails:
          $ref: "#/components/schemas/RtoDetails"

    ExecutionRequest:
      type: object
      properties:
        executionMode:
          type: string
          enum: [API, BROWSER, AUTO]
        confirmedByUser:
          type: boolean
          description: User has reviewed and confirmed the data before submission
      required:
        - confirmedByUser

    ExecutionResult:
      type: object
      properties:
        applicationId:
          type: number
        status:
          type: string
          enum: [submitting, completed, failed]
        resolvedExecutionMode:
          type: string
          enum: [API, BROWSER]
        message:
          type: string
        policy:
          oneOf:
            - $ref: "#/components/schemas/Policy"
            - type: "null"
      required:
        - applicationId
        - status
        - resolvedExecutionMode
        - message
        - policy

    ValidationResult:
      type: object
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
      required:
        - valid
        - errors
        - warnings

    SubmissionLog:
      type: object
      properties:
        id:
          type: number
        applicationId:
          type: number
        step:
          type: string
          enum: [data_ingestion, validation, routing, execution_api, execution_browser, finalization, error, browser_launch, page_loaded, form_vehicle, form_kyc, form_rto, form_submit, policy_issued, browser_error]
        status:
          type: string
          enum: [info, success, warning, error]
        message:
          type: string
        metadata:
          type: ["object", "null"]
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - applicationId
        - step
        - status
        - message
        - metadata
        - createdAt

    Policy:
      type: object
      properties:
        id:
          type: number
        applicationId:
          type: number
        policyNumber:
          type: string
        pdfUrl:
          type: ["string", "null"]
        providerName:
          type: string
        issuedAt:
          type: string
          format: date-time
      required:
        - id
        - applicationId
        - policyNumber
        - pdfUrl
        - providerName
        - issuedAt

    DashboardStats:
      type: object
      properties:
        total:
          type: number
        draft:
          type: number
        submitting:
          type: number
        completed:
          type: number
        failed:
          type: number
        policiesIssued:
          type: number
        providerBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/ProviderStat"
      required:
        - total
        - draft
        - submitting
        - completed
        - failed
        - policiesIssued
        - providerBreakdown

    ProviderStat:
      type: object
      properties:
        providerName:
          type: string
        count:
          type: number
        completed:
          type: number
      required:
        - providerName
        - count
        - completed

    # ── Ingest schemas ──────────────────────────────────────────────────────
    MsaFields:
      type: object
      description: Normalised vehicle + owner + RTO fields for an MSA payload
      properties:
        vehicleMake:
          type: string
        vehicleModel:
          type: string
        vehicleVariant:
          type: string
        vehicleEngineNumber:
          type: string
        vehicleChassisNumber:
          type: string
        vehicleExShowroomPrice:
          type: number
        vehicleDateOfPurchase:
          type: string
          format: date
        ownerFullName:
          type: string
        ownerBillingAddress:
          type: string
        ownerPincode:
          type: number
        ownerPhoneNumber:
          type: string
        ownerEmail:
          type: string
        ownerDateOfBirth:
          type: string
          format: date
        ownerIdProofType:
          type: string
          enum: [AADHAR, PAN, PASSPORT, DRIVING_LICENSE, VOTER_ID]
        ownerIdProofNumber:
          type: string
        rtoRegistrationCity:
          type: string
        rtoRegistrationState:
          type: string
        rtoCode:
          type: string
      required:
        - vehicleMake
        - vehicleModel
        - vehicleVariant
        - vehicleEngineNumber
        - vehicleChassisNumber
        - vehicleExShowroomPrice
        - vehicleDateOfPurchase
        - ownerFullName
        - ownerBillingAddress
        - ownerPincode
        - ownerPhoneNumber
        - ownerEmail
        - ownerDateOfBirth
        - ownerIdProofType
        - ownerIdProofNumber
        - rtoRegistrationCity
        - rtoRegistrationState
        - rtoCode

    IngestResult:
      type: object
      description: Extracted MSA fields from any ingest source
      properties:
        fields:
          $ref: "#/components/schemas/MsaFields"
        confidence:
          type: object
          description: Per-field confidence score 0-1
          additionalProperties:
            type: number
        rawText:
          type: ["string", "null"]
          description: Raw extracted text (OCR/scrape) for display in the review panel
        engineUsed:
          type: ["string", "null"]
          description: OCR engine that actually produced this result. Null for non-OCR sources.
        isDemoData:
          type: boolean
          description: True when the result came from the stub engine and contains fabricated values.
        attempts:
          type: array
          description: Every engine tried, in order, including failures. OCR only.
          items:
            $ref: "#/components/schemas/OcrAttempt"
        document:
          description: Stage 1 output — the document as the model actually read it.
          oneOf:
            - $ref: "#/components/schemas/DocumentExtraction"
            - type: "null"
        provenance:
          type: object
          description: MSA field name to the document label it came from, null if unmapped.
          additionalProperties:
            type: ["string", "null"]
        mappingMethod:
          type: ["string", "null"]
          enum: [llm, rules, null]
          description: How stage 2 resolved — an LLM call, or the deterministic fallback.
        tenant:
          description: >
            Which showroom, and through it which owner, a pulled deal belongs to.
            DMS pull only.
          oneOf:
            - $ref: "#/components/schemas/DmsTenant"
            - type: "null"
        dealContext:
          type: object
          additionalProperties: true
          description: >
            Facts the DMS supplies that the flat MSA payload has no room for —
            cubic capacity, motor kW, nominee, hypothecation, seating, invoice,
            and a `gaps` list naming what must be asked. DMS pull only.

            Deliberately loose for now. The authoritative shape is
            `DmsDealContext` in api-server/src/lib/dms/hero-adapter.ts, and it
            will be pinned down here when it is wired through /ingest/push into
            the applications columns that hold it. Declaring it loosely is
            better than leaving the response undeclared.
      required:
        - fields
        - confidence

    LoginInput:
      type: object
      properties:
        email: { type: string }
        password: { type: string }
      required: [email, password]

    SessionUser:
      type: object
      description: >
        Where tenant scope comes from. `ownerId` is never accepted from a
        request — it is read from the session, which is the whole point.
      properties:
        userId: { type: integer }
        ownerId: { type: integer }
        email: { type: string }
        name: { type: string }
        role:
          type: string
          enum: [OWNER, MANAGER, SALES_EXEC, SERVICE_ADVISOR, RTO_AGENT, ACCOUNTS, TECHNICIAN, PLATFORM_ADMIN]
          description: >
            OWNER and MANAGER are DDMS's own. The rest are the dealer's own role
            names, mirrored from `dms_employees.role`, so a login's role and the
            role on the work assigned to it are the same string.

            PLATFORM_ADMIN is not a dealership role at all: it is whoever runs
            the platform, and it exists so that insurers and OCR engines — the
            same rows for every dealership — have somebody who may edit them
            without that being an owner editing another owner's reference data.
            It can read no dealership module.
        empCode:
          type: ["string", "null"]
          description: >
            The dealer's own employee code, when this login is a member of
            staff. The same code already sits on the enquiries, registration
            files and job cards assigned to them — which is what makes "my work"
            mean anything. Null for an owner.
        showroomId:
          type: ["integer", "null"]
          description: The outlet they work at. Null means every outlet the owner holds.
        modules:
          type: array
          items: { type: string }
          description: >
            What this role may read, so the console can show a sidebar that
            matches what the database will answer. Cosmetic — the row policies
            are what actually refuse.
        permissions:
          type: array
          items: { type: string }
          description: >
            What this role may do, as `namespace.verb` — `policy.set`,
            `enquiry.reassign`. Resolved from the one permission table in
            lib/dms/permissions.ts, which also answers for the agent.

            Sent rather than derived in the browser: a screen deciding for
            itself whether somebody is an owner is a second permission table,
            and the one the user sees would be the one that drifts. Cosmetic in
            exactly the way modules is — the route refuses and the row policies
            refuse.
        showrooms:
          type: array
          description: >
            The outlets this session may act for, in the order they should be
            offered. One entry for a member of staff; the owner's whole set for
            an owner. Here rather than on a DDMS route because it is a fact
            about the person, not about the console — InsurRouter and VeloDocs
            both have to ask which outlet a new record belongs to, and neither
            should have to call the other product to find out.
          items:
            type: object
            properties:
              id: { type: integer }
              code: { type: string }
              name: { type: string }
            required: [id, code, name]
      required: [userId, ownerId, email, name, role]

    QueueModule:
      type: string
      enum: [DEAL, JOB_CARD, ENQUIRY, REGISTRATION, PART, RECEIVABLE, VEHICLE]

    QueueBand:
      type: string
      enum: [MINE, UNASSIGNED, OUTLET]
      description: >
        Whose it is. UNASSIGNED covers both "carrying nobody's code" and
        "carrying the code of somebody who has left" — one band, because to a
        dealership they are the same problem.

    QueueAction:
      type: object
      description: >
        A control the row may offer. Decided by the rules that own the module
        rather than by the screen, so the queue can render any module's controls
        without knowing what any of them mean.
      properties:
        action: { type: string }
        label: { type: string }
        doneLabel: { type: string }
        done: { type: boolean }
        tone:
          type: string
          enum: [amber, red, slate]
        extra:
          type: object
          additionalProperties: true
          description: >
            Fields the action needs beyond the record key — which branch a part
            comes from, which enquiry a unit was offered against.
      required: [action, label, doneLabel, done, tone]

    QueueJourney:
      type: object
      properties:
        id: { type: integer }
        definitionId:
          type: string
          description: Which map — VEHICLE_SALE, VEHICLE_DELIVERY.
        dealerCode:
          type: ["string", "null"]
          description: A deal id alone is not unique across two brands at one address.
        stepId: { type: string }
        stepTitle: { type: string }
        waitKind:
          type: string
          enum: [PERSON, OUTSIDE, JOURNEY, TIME]
          description: >
            TIME never reaches the queue. A file lodged on Tuesday is not work on
            Wednesday, and a queue full of things nobody can act on is one people
            stop reading.
        completed: { type: integer }
        total: { type: integer }
        loops: { type: integer }
      required: [id, definitionId, stepId, stepTitle, waitKind, completed, total, loops]

    QueueItem:
      type: object
      properties:
        module: { $ref: "#/components/schemas/QueueModule" }
        recordKey: { type: string }
        showroomId: { type: integer }
        showroomCode: { type: ["string", "null"] }
        band: { $ref: "#/components/schemas/QueueBand" }
        severity:
          type: integer
          description: 3 today, 2 this week, 1 behind the other two.
        waitingDays:
          type: integer
          description: >
            How long in the module's own terms — days late, days overdue, days
            on the floor. A lead's clock runs in minutes, so a breach on the
            same morning lands at zero and its severity carries it.
        title: { type: string }
        subtitle: { type: ["string", "null"] }
        state: { type: string }
        note: { type: ["string", "null"] }
        actionRequired: { type: string }
        assignedEmpCode: { type: ["string", "null"] }
        assignedEmpName: { type: ["string", "null"] }
        assigneeGone: { type: boolean }
        contactName: { type: ["string", "null"] }
        contactMobile: { type: ["string", "null"] }
        actions:
          type: array
          items: { $ref: "#/components/schemas/QueueAction" }
        assignAction:
          type: ["string", "null"]
          enum: [ENQUIRY_REASSIGN, JOB_CARD_REASSIGN, REGISTRATION_ASSIGN_AGENT, null]
          description: >
            The reassignment this row supports, when it has one. Not a button —
            a picker over staff who still work here, each carrying what they
            already hold. R-54 asks that work never becomes unroutable, and the
            screen that shows orphaned work has to be where it can be handed on,
            or "reassign to someone still here" is advice with a trip to another
            screen attached.
        assignRole:
          type: ["string", "null"]
          description: Which role the picker offers. Null means everybody at the outlet.
        source:
          type: string
          enum: [DERIVED, TASK, JOURNEY]
          description: >
            DERIVED is everything the queue has ever held — computed from the
            mirror on every request, never stored, gone the moment the record
            moves. TASK is a row somebody wrote down. JOURNEY is a process that
            stopped: the runtime knows which step, how far along, and how many
            times the outside world sent it back, none of which a classifier can
            say because a classifier only ever sees one record.

            They sit in one list and are sorted together, because a separate
            screen for any of them recreates exactly the problem the queue was
            built to solve. Where a record has a live journey the classifier
            stands aside, so no record appears twice saying two different things.
        tone:
          type: string
          enum: [PROBLEM, OPPORTUNITY]
          description: >
            PROBLEM on everything the queue has ever held. OPPORTUNITY arrived
            with OBJ-25 and means "everything is in place, this can be done now".
            It does not change the sort — an opportunity competes on the same
            three keys, because a dealership that always did the pleasant rows
            first would have a growing pile of the others.
        journey:
          description: >
            Set only on a JOURNEY row. Which step the sale stopped on, how far
            through it is, and how many times it has been sent backwards.
          oneOf:
            - $ref: "#/components/schemas/QueueJourney"
            - type: "null"
        taskId:
          type: integer
          description: Present only on a TASK row — what to close when it is done.
        agentSuggestion:
          oneOf:
            - $ref: "#/components/schemas/AgentSuggestion"
            - type: "null"
          description: >
            Who the agent would hand this to, and why. Only ever on an item in
            the Nobody's band that supports an assignment. Present whether or
            not the dealership has switched the agent on: off it is a suggestion
            with a person's click behind it, on the scheduler will already have
            applied it and the item will have changed band. Null when there is
            nobody left to hand it to.
        learned:
          oneOf:
            - $ref: "#/components/schemas/QueueLearned"
            - type: "null"
          description: >
            What this outlet did the last few times, and how far the product has
            earned the right to help (R-68, R-79). Null when there is no settled
            habit — null rather than a hedge, because a queue that says
            something about every item teaches people to stop reading it.
        href:
          type: string
          description: The module screen, for anyone who wants the full picture.
      required:
        - module
        - recordKey
        - showroomId
        - band
        - severity
        - waitingDays
        - title
        - state
        - actionRequired
        - assigneeGone
        - actions
        - href

    QueueResult:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/QueueItem" }
        total:
          type: integer
          description: >
            The leading number — everything waiting on a person, across every
            module this role may read.
        mine: { type: integer }
        unassigned: { type: integer }
        outlet: { type: integer }
        byModule:
          type: array
          items:
            type: object
            properties:
              module: { $ref: "#/components/schemas/QueueModule" }
              count: { type: integer }
            required: [module, count]
      required: [items, total, mine, unassigned, outlet, byModule]

    LedgerAccount:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        tallyName: { type: ["string", "null"] }
        group: { type: string, enum: [ASSET, LIABILITY, INCOME, EXPENSE, EQUITY] }
        isSystem: { type: string, enum: [Y, N] }
      required: [id, code, name, tallyName, group, isSystem]

    LedgerAccountPatch:
      type: object
      properties:
        name: { type: string }
        tallyName: { type: string }

    PostToLedgerInput:
      type: object
      properties:
        documentId: { type: integer }
      required: [documentId]

    ReverseVoucherInput:
      type: object
      properties:
        reason:
          type: string
          description: Required. It goes on the voucher and stays there.
      required: [reason]

    VoucherLine:
      type: object
      properties:
        seq: { type: integer }
        accountCode: { type: string }
        accountName: { type: string }
        debit: { type: string }
        credit: { type: string }
        narration: { type: ["string", "null"] }
        partyName: { type: ["string", "null"] }
      required: [seq, accountCode, accountName, debit, credit, narration, partyName]

    Voucher:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string }
        voucherNo: { type: string }
        voucherDate: { type: string }
        financialYear: { type: string }
        narration: { type: ["string", "null"] }
        status: { type: string, enum: [POSTED, REVERSED] }
        totalDebit: { type: string }
        totalCredit: { type: string }
        warnings:
          type: array
          items: { type: string }
          description: What the posting could not do, and why. Never silent.
        exportedAt: { type: ["string", "null"] }
        reversalOfId: { type: ["integer", "null"] }
        lines:
          type: array
          items: { $ref: "#/components/schemas/VoucherLine" }
      required: [id, kind, voucherNo, voucherDate, financialYear, narration, status, totalDebit, totalCredit, warnings, exportedAt, reversalOfId, lines]

    PostedVoucher:
      type: object
      properties:
        voucher: { $ref: "#/components/schemas/Voucher" }
        warnings:
          type: array
          items: { type: string }
      required: [warnings]

    Gstr1:
      type: object
      properties:
        gstin: { type: ["string", "null"] }
        financialYear: { type: string }
        period: { type: string }
        b2b:
          type: array
          description: Invoice-wise, as the portal requires for a registered buyer.
          items:
            type: object
            additionalProperties: true
        b2cs:
          type: array
          description: Aggregated by place of supply and rate, for everybody else.
          items:
            type: object
            additionalProperties: true
        hsn:
          type: array
          items:
            type: object
            additionalProperties: true
        problems:
          type: array
          items: { type: string }
        totals:
          type: object
          properties:
            invoices: { type: integer }
            taxableValue: { type: number }
            tax: { type: number }
          required: [invoices, taxableValue, tax]
      required: [gstin, financialYear, period, b2b, b2cs, hsn, problems, totals]

    TallyFeed:
      type: object
      properties:
        vouchers: { type: integer }
        voucherIds:
          type: array
          items: { type: integer }
        problems:
          type: array
          items: { type: string }
        xml: { type: string }
      required: [vouchers, voucherIds, problems, xml]

    HandedOverInput:
      type: object
      properties:
        voucherIds:
          type: array
          items: { type: integer }
        batch: { type: string }
      required: [voucherIds]

    AgentRun:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string }
        actor: { type: string }
        trigger: { type: string, enum: [SCHEDULER, PERSON, WEBHOOK] }
        outcome: { type: string, enum: [RUNNING, COMPLETED, FAILED, STOOD_DOWN] }
        reason: { type: ["string", "null"] }
        startedAt: { type: string }
        finishedAt: { type: ["string", "null"] }
        durationMs: { type: ["integer", "null"] }
        considered: { type: integer }
        proposed: { type: integer }
        acted: { type: integer }
        refused: { type: integer }
        modelCalls: { type: integer }
        costPaise: { type: integer }
      required: [id, kind, actor, trigger, outcome, reason, startedAt, finishedAt, durationMs, considered, proposed, acted, refused, modelCalls, costPaise]

    RunStep:
      type: object
      properties:
        seq: { type: integer }
        kind: { type: string, enum: [READ, PROPOSE, ACT, REFUSED, MODEL] }
        module: { type: ["string", "null"] }
        recordKey: { type: ["string", "null"] }
        action: { type: ["string", "null"] }
        detail: { type: ["string", "null"] }
        decisionId:
          type: ["integer", "null"]
          description: The decision_log row this produced. Named, never copied.
        model: { type: ["string", "null"] }
        costPaise: { type: ["integer", "null"] }
        ms: { type: ["integer", "null"] }
        at: { type: string }
      required: [seq, kind, module, recordKey, action, detail, decisionId, model, costPaise, ms, at]

    RunList:
      type: object
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/AgentRun" }
        spentTodayPaise: { type: integer }
        capPaise: { type: integer }
        standingDown:
          type: ["object", "null"]
          properties:
            reason: { type: string }
            at: { type: string }
          required: [reason, at]
      required: [runs, spentTodayPaise, capPaise, standingDown]

    RunDetail:
      type: object
      properties:
        run: { $ref: "#/components/schemas/AgentRun" }
        steps:
          type: array
          items: { $ref: "#/components/schemas/RunStep" }
      required: [run, steps]

    ChannelStatus:
      type: object
      properties:
        channel: { type: string, enum: [WHATSAPP, EMAIL, SMS] }
        configured: { type: boolean }
        active: { type: boolean }
        displayAddress:
          type: ["string", "null"]
          description: The number or address customers see. Not a secret.
        secretHint:
          type: ["string", "null"]
          description: The last four characters, masked. Never the token.
        canReceive:
          type: boolean
          description: >
            A signing secret is stored, so inbound webhooks can be verified. A
            channel without one can send and may not receive — an unsigned
            webhook is an open endpoint anybody may post a customer
            conversation into.
        lastUsedAt: { type: ["string", "null"] }
        lastError: { type: ["string", "null"] }
        blocker:
          type: ["string", "null"]
          description: Why this cannot be used yet, and whose problem it is.
      required: [channel, configured, active, displayAddress, secretHint, canReceive, lastUsedAt, lastError, blocker]

    ChannelActiveInput:
      type: object
      properties:
        channel: { type: string, enum: [WHATSAPP, EMAIL] }
        active: { type: boolean }
      required: [channel, active]

    ConnectChannelInput:
      type: object
      properties:
        channel: { type: string, enum: [WHATSAPP, EMAIL] }
        displayAddress:
          type: string
          description: The WhatsApp Business number, or the from-address.
        secret:
          type: string
          description: >
            The access token or mailbox password. Write-only — it is encrypted
            on arrival and no response ever carries it back.
        signingSecret:
          type: ["string", "null"]
          description: >
            Meta's app secret, which signs every inbound webhook. Without it
            this channel can send and cannot receive. Omitting it on a
            re-paste leaves the stored one alone, so rotating an access token
            does not silently disable inbound.
        config:
          type: object
          additionalProperties: true
          description: >
            WhatsApp needs `phoneNumberId`. Email needs `host`, `port`,
            `secure` and `user`.
      required: [channel, displayAddress, secret]

    InboundReply:
      type: object
      properties:
        id: { type: integer }
        channel: { type: string }
        fromAddress: { type: string }
        fromName: { type: ["string", "null"] }
        body:
          type: string
          description: Exactly what arrived. Never edited, never summarised.
        module: { type: ["string", "null"] }
        recordKey: { type: ["string", "null"] }
        matchBasis: { type: string, enum: [OUTBOUND_THREAD, MOBILE, NONE] }
        matchConfidence: { type: ["string", "null"] }
        receivedAt: { type: string }
      required: [id, channel, fromAddress, fromName, body, module, recordKey, matchBasis, matchConfidence, receivedAt]

    OverviewFigure:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        value: { type: number }
        unit:
          type: string
          enum: [COUNT, RUPEES, DAYS]
        tone:
          type: string
          enum: [PLAIN, WATCH, BAD]
          description: >
            BAD is reserved for numbers that should be zero and are not. WATCH
            is fine now and will not stay fine. Most of a good screen is PLAIN
            — a dashboard where everything is red is one nobody reads twice.
        href:
          type: ["string", "null"]
          description: The screen listing the rows behind this number.
        hint: { type: ["string", "null"] }
      required: [key, label, value, unit, tone, href, hint]

    OverviewSection:
      type: object
      properties:
        id:
          type: string
          enum: [ATTENTION, MONEY, HELD, AGEING, GAP, UNATTENDED]
        title: { type: string }
        blurb: { type: string }
        figures:
          type: array
          items: { $ref: "#/components/schemas/OverviewFigure" }
      required: [id, title, blurb, figures]

    OverviewResult:
      type: object
      properties:
        generatedAt: { type: string, format: date-time }
        scope:
          type: object
          properties:
            ownerName: { type: string }
            outlets:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  code: { type: string }
                required: [id, name, code]
            modules:
              type: array
              items: { type: string }
            withheld:
              type: array
              description: >
                Modules outside this role, named rather than counted as zero.
              items:
                type: object
                properties:
                  module: { type: string }
                  reason: { type: string }
                required: [module, reason]
          required: [ownerName, outlets, modules, withheld]
        mirror:
          type: object
          description: >
            The stalest sync across the visible outlets, which is the honest
            bound — reporting the newest would let one outlet that synced a
            minute ago vouch for another that has not synced since Tuesday.
          properties:
            lastSyncedAt: { type: ["string", "null"] }
            staleHours: { type: ["integer", "null"] }
          required: [lastSyncedAt, staleHours]
        headline:
          type: array
          description: >
            At most three sentences, chosen by a fixed severity table and
            worded by a function. No model is involved.
          items: { type: string }
        sections:
          type: array
          items: { $ref: "#/components/schemas/OverviewSection" }
        limits:
          type: array
          description: What this view cannot tell you, derived from what it read.
          items: { type: string }
      required: [generatedAt, scope, mirror, headline, sections, limits]

    PolicySetInput:
      type: object
      properties:
        key: { type: string }
        value:
          type: ["integer", "null"]
          description: Null resets this setting to the product's default.
        showroomId:
          type: integer
          description: Which outlet the change is logged against.
      required: [key, value, showroomId]

    PolicyResetInput:
      type: object
      properties:
        showroomId: { type: integer }
      required: [showroomId]

    PolicySetting:
      type: object
      properties:
        key:
          type: string
          description: >
            `SEVERITY.MODULE.STATE` for what comes first, or
            `THRESHOLD.NAME` for when something has gone wrong.
        group:
          type: string
          enum: [SEVERITY, THRESHOLD, SWITCH]
        section:
          type: string
          description: The screen this belongs to, for grouping.
        label: { type: string }
        help:
          type: string
          description: One sentence. What changing it actually does.
        value: { type: integer }
        default: { type: integer }
        isDefault:
          type: boolean
          description: False once somebody in this dealership has moved it.
        min: { type: integer }
        max: { type: integer }
        unit:
          type: string
          enum: [rank, days, switch]
          description: >
            switch is stored as 0 or 1 so dealer_policy stays a table of numbers
            and a reset is still a delete. It is the one setting here that is not
            a number, and it earns the exception because the decision it carries
            is the dealership's.
      required: [key, group, section, label, help, value, default, isDefault, min, max, unit]

    QueueLearned:
      type: object
      description: >
        sentence and prefill can disagree, and both are shown. The sentence is
        what people here did; the prefill is what the agent proposes, chosen by
        a rule on today's workload. "The last seven went to Jaswinder" and
        "Ramesh is carrying the least today" are two true things and which wins
        is the person's call — precedent informs, it never decides (R-69).
      properties:
        patternKey:
          type: string
          description: MODULE:STATE:ACTION. The unit that graduates, per R-79.
        rung:
          type: string
          enum: [WATCHING, RECALL, PREFILLED, AUTOMATIC]
        sentence:
          type: ["string", "null"]
          description: A count and a date, or nothing at all (R-68).
        prefill:
          type: ["string", "null"]
          description: The value to arrive already selected, at rung 2 and above.
        because:
          type: string
          description: Why the product is at this rung here. Arguable, on purpose.
      required: [patternKey, rung, because]

    AutonomyPattern:
      type: object
      properties:
        patternKey: { type: string }
        module: { type: string }
        state: { type: string }
        action: { type: string }
        rung:
          type: string
          enum: [WATCHING, RECALL, PREFILLED, AUTOMATIC]
        rungLabel: { type: string }
        rungMeaning: { type: string }
        ceiling:
          type: string
          enum: [WATCHING, RECALL, PREFILLED, AUTOMATIC]
          description: >
            The highest this pattern may ever reach. PREFILLED where the action
            asserts that a person did something — no amount of precedent
            promotes past it (R-80), and the ceiling is may("AGENT", …) rather
            than a second list that could drift out of step.
        ceilingReason: { type: ["string", "null"] }
        sentence: { type: ["string", "null"] }
        because: { type: string }
        decisions:
          type: integer
          description: Decisions a **person** made in the window. Never the agent's (R-66).
        windowDays: { type: integer }
        offered: { type: integer }
        accepted: { type: integer }
        overridden: { type: integer }
        acted:
          type: integer
          description: Done by the agent under standing consent. Not an acceptance.
        overrideRatePct:
          type: ["integer", "null"]
          description: >
            Of the ones somebody actually answered. Items nobody reached count
            neither way — a busy week is not a rejection.
        consentDue:
          type: boolean
          description: >
            The evidence is there, the floor allows it, and nobody has been
            asked. **The product asks; it never promotes itself.**
        consentedBy: { type: ["string", "null"] }
        consentedAt: { type: ["string", "null"] }
      required:
        [patternKey, module, state, action, rung, rungLabel, rungMeaning, ceiling,
         because, decisions, windowDays, offered, accepted, overridden, acted, consentDue]

    AutonomyNumbers:
      type: object
      description: >
        The dealership's own thresholds, on the same response as the counts they
        judge. "12 accepted" without saying 10 is the bar has said nothing.
      properties:
        windowDays: { type: integer }
        recallAfter: { type: integer }
        prefillAfter: { type: integer }
        consentAfter: { type: integer }
        overrideCeilingPct: { type: integer }
      required: [windowDays, recallAfter, prefillAfter, consentAfter, overrideCeilingPct]

    AutonomyConsentInput:
      type: object
      properties:
        patternKey: { type: string }
        onCount:
          type: integer
          description: The count that was on the table when they said yes. Their evidence.
      required: [patternKey]

    AutonomyRevokeInput:
      type: object
      properties:
        patternKey: { type: string }
        reason: { type: string }
      required: [patternKey]

    AutonomyProposal:
      type: object
      properties:
        id: { type: integer }
        patternKey: { type: string }
        module: { type: string }
        recordKey: { type: string }
        action: { type: string }
        reason: { type: ["string", "null"] }
        rung: { type: integer }
        outcome:
          type: string
          enum: [OFFERED, ACCEPTED, OVERRIDDEN, ACTED, EXPIRED]
          description: >
            EXPIRED is nobody getting to it, and it counts neither way.
            OVERRIDDEN is somebody doing something else, and it is the signal
            that demotes.
        createdAt: { type: string }
        outcomeAt: { type: ["string", "null"] }
      required: [id, patternKey, module, recordKey, action, rung, outcome, createdAt]

    AgentSuggestion:
      type: object
      description: >
        What the agent would do to one queue item, and why. The same object
        whether it is about to be applied or is only being shown, so what the
        agent proposed and what the agent did cannot describe the work
        differently.

        The choice is made by a rule — the lightest-loaded person in the role
        the queue asks for, from staff who still work here — because a rule that
        is right every time beats a model that is right most of the time (R-49).
        A model may only phrase the reason, and only if every figure in it
        appears in the evidence.
      properties:
        action:
          type: string
          enum: [ENQUIRY_REASSIGN, REGISTRATION_ASSIGN_AGENT]
          description: >
            The whole of what the agent may call. The other ten registry actions
            assert that a person did something — rang the customer, chased the
            RTO, showed the bike — and a model cannot make a phone call. See
            CLOSED_TO_THE_AGENT in lib/dms/agent.ts, which names each one.
        empCode: { type: string }
        empName: { type: string }
        carrying:
          type: integer
          description: What they are already carrying. On the row, because it is the reason.
        consideredCount:
          type: integer
          description: How many were in the running. One candidate is worth saying so.
        reason:
          type: string
          description: One sentence, deterministic unless a model improved it and the check held.
        narrationRejected:
          type: ["string", "null"]
      required: [action, empCode, empName, carrying, consideredCount, reason]

    AutomationRule:
      type: object
      properties:
        id:
          type: string
          description: Stable. Lands in `outbound_messages.authorisedRule` and the decision log.
        title: { type: string }
        module:
          type: string
          enum: [REGISTRATION, JOB_CARD, ENQUIRY, RECEIVABLE]
        on:
          type: string
          description: The state whose presence triggers it. Leaving it is the goal.
        template: { type: string }
        cadenceDays:
          type: integer
          description: >
            How long before it may raise the same thing again while the record
            has not moved. The cadence and the de-duplication are one number, so
            the two cannot disagree.
        goal:
          type: string
          description: Why it stops, in words. The mechanism is leaving `on`.
        conditional:
          type: boolean
          description: >
            True when the rule carries an extra condition over the row beyond
            the state — shown because "fires on every one of these" and "fires
            on some of these" are different promises.
      required: [id, title, module, on, template, cadenceDays, goal, conditional]

    ShowroomSummary:
      type: object
      description: One outlet, with enough of its owner and DMS wiring to pick it.
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        city: { type: ["string", "null"] }
        state: { type: ["string", "null"] }
        isActive: { type: boolean }
        ownerId: { type: integer }
        ownerName: { type: string }
        dmsAccounts:
          type: array
          description: >
            The OEM dealer codes this showroom holds. Empty means nothing to
            sync — the showroom exists but is not wired to a DMS, which is a
            configuration gap the console should say out loud.
          items:
            type: object
            properties:
              oemCode: { type: string }
              dealerCode: { type: string }
              insuranceChannel: { type: ["string", "null"] }
              isActive: { type: boolean }
            required: [oemCode, dealerCode, isActive]
      required: [id, code, name, isActive, ownerId, ownerName, dmsAccounts]

    PanelEntry:
      type: object
      description: >
        One insurer on one outlet's panel. `providers` says how to reach an
        insurer; this says what this dealer's arrangement with them is. Neither
        is derivable from the other.
      properties:
        insurerCode: { type: string }
        insurerName: { type: string }
        shortName: { type: string }
        providerId:
          type: integer
          description: The providers row, so a caller can execute against it.
        dealerCode:
          type: string
          description: >
            Which DMS account's arrangement this is. A showroom holding two
            brands has two panels and both appear — a deal from one brand
            cannot be placed on the other brand's panel.
        route:
          type: string
          enum: [BROKER, DIRECT_AGENT]
          description: >
            Taken from the DMS account's insuranceChannel, never stored on the
            panel row, so the two cannot disagree.
        integration:
          type: string
          enum: [API, PORTAL]
          description: >
            What this dealer can reach. Not the same as the provider's own
            execution mode: a broker platform can front an insurer through a
            web portal even where that insurer publishes an API.
        odBaseRate: { type: number }
        quotaPolicies: { type: integer }
        quotaConsumed: { type: integer }
        payoutRate: { type: number }
        slaMinutes: { type: integer }
        isEnabled: { type: boolean }
        quota:
          type: object
          properties:
            remaining: { type: integer }
            utilisation: { type: number }
            exhausted: { type: boolean }
            tight:
              type: boolean
              description: Near the limit — worth warning about, still selectable.
          required: [remaining, utilisation, exhausted, tight]
        eligible: { type: boolean }
        reasons:
          type: array
          description: >
            Why an insurer is excluded, as a list rather than a boolean. A
            dealer who cannot see the reason will not trust the recommendation,
            and an unexplained recommendation is worse than none.
          items: { type: string }
      required:
        [insurerCode, insurerName, shortName, providerId, dealerCode, route,
         integration, odBaseRate, quotaPolicies, quotaConsumed, payoutRate,
         slaMinutes, isEnabled, quota, eligible, reasons]

    DmsSyncResult:
      type: object
      description: What one sync of one DMS account did.
      properties:
        showroomId: { type: integer }
        dealerCode: { type: string }
        seen:
          type: integer
          description: Deals the DMS listed.
        added: { type: integer }
        changed: { type: integer }
        unchanged: { type: integer }
        disappeared:
          type: integer
          description: >
            Mirrored deals the DMS no longer lists. Marked, never deleted — a
            deal vanishing is itself information.
        startedAt: { type: string }
        finishedAt: { type: string }
        durationMs: { type: integer }
      required:
        [showroomId, dealerCode, seen, added, changed, unchanged, disappeared,
         startedAt, finishedAt, durationMs]

    ReconcileState:
      type: string
      enum: [IN_SYNC, AHEAD, BEHIND, CONFLICT, NOT_STARTED]
      description: >
        How our record compares to the dealer's system for one deal.
        AHEAD means we did the work and their system does not know yet — the
        normal state under a read-only integration, and a task rather than an
        error. BEHIND means somebody worked outside DDMS. CONFLICT means two
        different policy numbers on one vehicle.

    WorklistRow:
      type: object
      properties:
        dealId: { type: string }
        dealerCode: { type: string }
        showroomId: { type: integer }
        showroomCode: { type: ["string", "null"] }
        customerName: { type: ["string", "null"] }
        modelDescription: { type: ["string", "null"] }
        chassisNo: { type: ["string", "null"] }
        bookingDate: { type: ["string", "null"] }
        dms:
          type: object
          description: What the dealer's own system currently believes.
          properties:
            status: { type: string }
            policyNo: { type: ["string", "null"] }
            insurerCode: { type: ["string", "null"] }
            regNo: { type: ["string", "null"] }
          required: [status]
        ddms:
          type: object
          description: What we know, which may be more recent.
          properties:
            applicationId: { type: ["integer", "null"] }
            applicationStatus: { type: ["string", "null"] }
            policyNumber: { type: ["string", "null"] }
            policySimulated:
              type: boolean
              description: True when the number came from a stub, not an insurer.
            providerName: { type: ["string", "null"] }
          required: [policySimulated]
        reconcile:
          $ref: "#/components/schemas/ReconcileState"
        reconcileNote:
          type: ["string", "null"]
          description: Plain-English statement of the difference.
        actionRequired:
          type: ["string", "null"]
          description: The one thing to do next, when there is one.
        daysInStatus:
          type: integer
          description: >
            Days since the DMS status last moved. This is the number nobody has
            time to work out by hand, and the reason a mirror exists at all.
        lastSyncedAt: { type: string }
        disappearedFromDms: { type: boolean }
      required:
        [dealId, dealerCode, showroomId, dms, ddms, reconcile, daysInStatus,
         lastSyncedAt, disappearedFromDms]

    WorklistSummary:
      type: object
      properties:
        total: { type: integer }
        byReconcile:
          type: object
          additionalProperties: { type: integer }
        byDmsStatus:
          type: object
          additionalProperties: { type: integer }
        needsAction:
          type: integer
          description: Rows with an action attached. What the console leads with.
        oldestDaysInStatus: { type: integer }
        lastSyncedAt: { type: ["string", "null"] }
      required: [total, byReconcile, byDmsStatus, needsAction, oldestDaysInStatus]

    LeadState:
      type: string
      enum:
        [SLA_BREACHED, CLOCK_RUNNING, NO_OWNER, UNCONTACTED, FOLLOW_UP_OVERDUE,
         ON_TRACK, CONVERTED, LOST]
      description: >
        SLA_BREACHED and CLOCK_RUNNING apply only to manufacturer-generated
        leads, which carry a timed first-response mandate. NO_OWNER means the
        assigned executive has left and nobody has picked the lead up — worse
        than late, because late at least implies somebody is on it.

    LeadWorklistRow:
      type: object
      properties:
        enqId: { type: string }
        dealerCode: { type: string }
        showroomId: { type: integer }
        customerName: { type: ["string", "null"] }
        customerMobile: { type: ["string", "null"] }
        modelInterest: { type: ["string", "null"] }
        dms:
          type: object
          description: What the dealer's CRM holds.
          properties:
            source: { type: string }
            grade: { type: ["string", "null"] }
            stage: { type: string }
            enquiredAt: { type: ["string", "null"] }
            firstContactAt: { type: ["string", "null"] }
            nextFollowUpDate: { type: ["string", "null"] }
            assignedEmpCode: { type: ["string", "null"] }
            assignedEmpName: { type: ["string", "null"] }
            assignedEmpActive: { type: boolean }
            assignedEmpLeftOn: { type: ["string", "null"] }
            lostReason: { type: ["string", "null"] }
            convertedDealId: { type: ["string", "null"] }
          required: [source, stage, assignedEmpActive]
        ddms:
          type: object
          description: Ours. The DMS has no column for any of this.
          properties:
            reassignedToEmpCode: { type: ["string", "null"] }
            contactedAt:
              type: ["string", "null"]
              description: >
                When *we* recorded a contact. Never conflated with the DMS's own
                firstContactAt above — see slaNote.
            contactChannel: { type: ["string", "null"] }
          required: [reassignedToEmpCode, contactedAt]
        state:
          $ref: "#/components/schemas/LeadState"
        slaNote:
          type: ["string", "null"]
          description: >
            Present only when we have logged a contact and the dealer's CRM has
            not. The integration is read-only, so this gap cannot be closed from
            here — and the manufacturer measures their field, not ours. Saying
            so is the difference between a useful screen and one that tells an
            owner they are compliant when the OEM's report disagrees.
        note: { type: ["string", "null"] }
        actionRequired: { type: ["string", "null"] }
        responseMinutes:
          type: ["integer", "null"]
          description: >
            Minutes to first contact, or minutes elapsed so far when nobody has
            made contact at all.
        minutesToSla:
          type: ["integer", "null"]
          description: Minutes left in the window. Negative once it has closed.
        followUpDaysOverdue: { type: integer }
        lastSyncedAt: { type: string }
      required:
        [enqId, dealerCode, showroomId, dms, ddms, state, followUpDaysOverdue,
         lastSyncedAt]

    LeadWorklistSummary:
      type: object
      properties:
        total: { type: integer }
        byState:
          type: object
          additionalProperties: { type: integer }
        needsAction: { type: integer }
        slaBreached: { type: integer }
        orphaned:
          type: integer
          description: Live leads with nobody active against them.
        slaMinutes:
          type: integer
          description: The response mandate being measured against.
        lastSyncedAt: { type: ["string", "null"] }
      required: [total, byState, needsAction, slaBreached, orphaned, slaMinutes]

    ServiceState:
      type: string
      enum:
        [AWAITING_APPROVAL, AWAITING_PART, READY_UNCOLLECTED, OVERDUE,
         FOLLOW_UP_DUE, ON_TRACK, CLOSED]
      description: >
        What a job card needs from a human, ordered by what a service manager
        deals with first. Every state except ON_TRACK and CLOSED resolves to
        somebody picking up a phone — a workshop's backlog is mostly unmade
        calls. READY_UNCOLLECTED is the quiet one: the work is finished, the bay
        is occupied, and the customer has not been told.

    ServiceWorklistRow:
      type: object
      properties:
        jcNo: { type: string }
        dealerCode: { type: string }
        showroomId: { type: integer }
        showroomCode: { type: ["string", "null"] }
        customerName: { type: ["string", "null"] }
        customerMobile: { type: ["string", "null"] }
        modelDescription: { type: ["string", "null"] }
        regNo: { type: ["string", "null"] }
        jcType: { type: string }
        advisorEmpCode: { type: ["string", "null"] }
        dms:
          type: object
          description: What the workshop's own system believes.
          properties:
            status: { type: string }
            jcDate: { type: ["string", "null"] }
            promisedDate: { type: ["string", "null"] }
            actualCloseDate: { type: ["string", "null"] }
            estimateAmount: { type: ["number", "null"] }
            finalAmount: { type: ["number", "null"] }
            hasUnissuedPart:
              type: boolean
              description: At least one part line still not on the shelf.
            psfDone: { type: boolean }
          required: [status, hasUnissuedPart, psfDone]
        ddms:
          type: object
          description: Ours. The DMS has no column for this.
          properties:
            customerInformedAt: { type: ["string", "null"] }
          required: [customerInformedAt]
        state:
          $ref: "#/components/schemas/ServiceState"
        note: { type: ["string", "null"] }
        actionRequired: { type: ["string", "null"] }
        daysLate:
          type: integer
          description: Days past the promised date. Negative means still in hand.
        daysInStatus: { type: integer }
        lastSyncedAt: { type: string }
        disappearedFromDms: { type: boolean }
      required:
        [jcNo, dealerCode, showroomId, jcType, dms, ddms, state, daysLate,
         daysInStatus, lastSyncedAt, disappearedFromDms]

    ServiceWorklistSummary:
      type: object
      properties:
        total: { type: integer }
        byState:
          type: object
          additionalProperties: { type: integer }
        needsAction: { type: integer }
        readyUncollected:
          type: integer
          description: Finished but not collected — occupied bays and unmade calls.
        worstDaysLate: { type: integer }
        lastSyncedAt: { type: ["string", "null"] }
      required: [total, byState, needsAction, readyUncollected, worstDaysLate]

    DmsActionInput:
      type: object
      properties:
        action:
          type: string
          enum:
            [ENQUIRY_LOG_CONTACT, ENQUIRY_REASSIGN, JOB_CARD_MARK_INFORMED, JOB_CARD_REASSIGN,
             REGISTRATION_ASSIGN_AGENT, REGISTRATION_MARK_NOTIFIED,
             REGISTRATION_LOG_CHASE, PART_REQUEST_TRANSFER, PART_RAISE_REORDER,
             RECEIVABLE_LOG_CHASE, RECEIVABLE_MARK_DISPUTED,
             VEHICLE_MARK_OFFERED, VEHICLE_PROPOSE_TRANSFER]
        showroomId: { type: integer }
        recordKey:
          type: string
          description: The mirror row's own key — enqId, jcNo, regnFileNo, partNo.
        clear:
          type: boolean
          description: Undo rather than do. Supported by every action.
        empCode:
          type: string
          description: Required by the two assignment actions. Must be somebody still employed.
        channel:
          type: string
          enum: [CALL, WHATSAPP, SMS, EMAIL, VISIT]
          description: ENQUIRY_LOG_CONTACT only. Defaults to CALL.
        fromShowroomId:
          type: integer
          description: PART_REQUEST_TRANSFER only — which outlet is sending it. Must be the same owner's.
        enqId:
          type: string
          description: VEHICLE_MARK_OFFERED only — the enquiry the unit was offered against.
        toShowroomId:
          type: integer
          description: VEHICLE_PROPOSE_TRANSFER only — which outlet should receive it. Must be the same owner's.
        note: { type: string }
      required: [action, showroomId, recordKey]

    DraftMessageInput:
      type: object
      properties:
        template:
          $ref: "#/components/schemas/MessageTemplate"
        showroomId: { type: integer }
        recordKey:
          type: string
          description: The mirror row's own key — jcNo, regnFileNo, enqId.
      required: [template, showroomId, recordKey]

    MessageTemplate:
      type: string
      enum: [SERVICE_VEHICLE_READY, REGISTRATION_RC_READY, REGISTRATION_AGENT_ASSIGNED, LEAD_HANDOVER, RECEIVABLE_STATEMENT]
      description: >
        Two customer messages and two internal ones. The internal pair require the
        record to have been assigned first, which is what makes them a
        notification rather than a broadcast.

    OutboundMessage:
      type: object
      properties:
        id: { type: integer }
        ownerId: { type: integer }
        showroomId: { type: integer }
        module:
          type: string
          enum: [DEAL, JOB_CARD, ENQUIRY, REGISTRATION, PART, RECEIVABLE, VEHICLE]
        recordKey: { type: string }
        audience:
          type: string
          enum: [INTERNAL, CUSTOMER]
          description: >
            The axis the whole gate turns on. A rule may permit an internal
            message. Nothing permits a customer one except a person.
        channel:
          type: string
          enum: [EMAIL, WHATSAPP, SMS]
        toName: { type: ["string", "null"] }
        toAddress: { type: ["string", "null"] }
        toEmpCode: { type: ["string", "null"] }
        subject: { type: ["string", "null"] }
        body: { type: string }
        template: { type: string }
        draftedBy:
          type: string
          enum: [RULE, AGENT, PERSON]
          description: >
            AGENT means a model rephrased the template draft and the rephrasing
            passed a check that it asserted no figure the facts do not support. A
            rewrite that failed that check never reaches this row.

            PERSON means a named member of staff typed into it, and it is the one
            value the fact check does not stand behind — deliberately. The check
            guards against a model inventing figures; somebody signed in writing
            their own sentence and approving it is a person taking responsibility.
            What keeps it safe is the gate: a PERSON draft can never take the rule
            path.
        facts:
          type: ["object", "null"]
          additionalProperties: true
          description: The values the body is permitted to assert.
        status:
          type: string
          enum: [DRAFT, APPROVED, SENT, HELD_NO_TRANSPORT, FAILED, CANCELLED]
        authorisedBasis:
          type: ["string", "null"]
        authorisedRule: { type: ["string", "null"] }
        approvedByUserId: { type: ["integer", "null"] }
        approvedAt: { type: ["string", "null"] }
        sentAt:
          type: ["string", "null"]
          description: Written only by the send endpoint, and only after the gate returned a basis.
        failureReason: { type: ["string", "null"] }
        composedSubject:
          type: ["string", "null"]
        composedBody:
          type: ["string", "null"]
          description: >
            What the rule composed, kept when somebody edits. Null until the first
            edit, and written once — so it is always the composed text rather than
            the previous edit.
        editedByUserId: { type: ["integer", "null"] }
        editedByName:
          type: ["string", "null"]
          description: >
            The name they had at the time. Denormalised because it is an audit
            fact, and because the credential every request runs on has no grant on
            the users table.
        editedAt: { type: ["string", "null"] }
        createdByUserId: { type: ["integer", "null"] }
        createdAt: { type: string }
      required: [id, ownerId, showroomId, module, recordKey, audience, channel, body, template, draftedBy, status, createdAt]

    MessageNoteInput:
      type: object
      description: An optional note recorded against the approval or the cancellation.
      properties:
        note: { type: string }

    InvoiceReadinessCondition:
      type: object
      properties:
        id: { type: string }
        what: { type: string }
        met: { type: boolean }
        missing: { type: string }
      required: [id, what, met]

    InvoiceReadiness:
      type: object
      properties:
        dealerCode: { type: string }
        dealId: { type: string }
        showroomId: { type: integer }
        ready: { type: boolean }
        conditions:
          type: array
          items: { $ref: "#/components/schemas/InvoiceReadinessCondition" }
        preview:
          oneOf:
            - type: object
              properties:
                customerName: { type: ["string", "null"] }
                modelDescription: { type: ["string", "null"] }
                chassisNo: { type: ["string", "null"] }
                exShowroomAmount: { type: ["number", "null"] }
                priceListName: { type: ["string", "null"] }
                priceListEffectiveFrom: { type: ["string", "null"] }
                pricedOffCurrentList: { type: boolean }
              required: [pricedOffCurrentList]
            - type: "null"
      required: [dealerCode, dealId, showroomId, ready, conditions]

    TypedSale:
      type: object
      description: >
        A sale somebody typed in, for a dealership with no manufacturer's system
        behind it (R-96). A model is required because there is nothing to price
        otherwise, and a chassis number is required because it is what makes the
        sale identifiable - without it two invoices for the same bike are
        indistinguishable and the sold-this-twice check has nothing to check.
        Everything else is optional, which is the right asymmetry for a form
        somebody fills in while a customer waits.
      properties:
        customerName: { type: ["string", "null"] }
        customerMobile: { type: ["string", "null"] }
        customerAddress: { type: ["string", "null"] }
        customerGstin:
          type: ["string", "null"]
          description: >
            Filled makes the sale B2B, which is a different line in GSTR-1.
            Collected now because the customer is standing in front of somebody
            now and will not be in October.
        modelDescription: { type: string }
        chassisNo: { type: string }
        engineNo: { type: ["string", "null"] }
        dmsInvoiceNo:
          type: ["string", "null"]
          description: For a dealership numbering its invoices somewhere outside DDMS.
        dealId:
          type: ["string", "null"]
          description: Defaults to the chassis number, which is the honest key.
      required: [modelDescription, chassisNo]

    StatedPrice:
      type: object
      description: >
        The price, HSN and rates typed onto this one document. What a dealership
        selling five units a month has before it has ever built a price list -
        and under R-97 a confirmed figure rather than a proposal, because a
        person entered it. Still worse in every other way, because it teaches
        the product nothing about the next sale, so the document records that it
        was stated rather than looked up.
      properties:
        exShowroomAmount: { type: number }
        hsn: { type: ["string", "null"] }
        gstRatePct:
          type: number
          description: Falls back to the list's, then to 28.
        cessRatePct:
          type: number
          description: >
            Falls back to the list's, then to 0 - which is right below 350cc and
            wrong above it. That is why the form asks: a guessed cess is a
            short-paid return.
      required: [exShowroomAmount]

    GenerateDocumentInput:
      type: object
      description: >
        Exactly one of (dealerCode + dealId) or sale. Sending both describes two
        different sales at once and is refused rather than resolved, because
        silently picking one would issue a tax invoice for whichever the code
        happened to test first.
      properties:
        showroomId: { type: integer }
        dealerCode: { type: ["string", "null"] }
        dealId: { type: ["string", "null"] }
        sale:
          oneOf:
            - $ref: "#/components/schemas/TypedSale"
            - type: "null"
        statedPrice:
          oneOf:
            - $ref: "#/components/schemas/StatedPrice"
            - type: "null"
        intent:
          type: string
          enum: [SALE, QUOTATION, PROFORMA]
          default: SALE
        priceListId:
          type: ["integer", "null"]
          description: >
            The dealer's choice of list. Absent means the current one. Naming a
            list that does not cover the model is refused rather than quietly
            falling back — he asked for a specific price.
        dealerDiscount:
          type: number
          description: The dealer's own margin, given away. His decision.
        oemSchemeAmount:
          type: number
          description: >
            The manufacturer's scheme on this unit. Claimable in full whatever
            happens to the next field.
        oemSchemePassedOn:
          type: number
          description: How much of the scheme reached the customer. May be zero.
        otherCharges:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              amount: { type: number }
            required: [label, amount]
        placeOfSupply:
          type: ["string", "null"]
          description: Decides CGST+SGST against IGST. Defaults to the outlet's own state.
      required: [showroomId]

    InvoiceSeller:
      type: object
      description: >
        Who issued it. The legal name and GSTIN come off the document itself
        where it has them — a document reprinted next year must show the
        identity that issued it, not whatever the outlet is called today, the
        same instinct as storing the tax amounts rather than the tax rule.
      properties:
        legalName: { type: ["string", "null"] }
        gstin: { type: ["string", "null"] }
        addressLine: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        state: { type: ["string", "null"] }
        pincode: { type: ["string", "null"] }

    SaleDocument:
      type: object
      properties:
        id: { type: integer }
        kind:
          type: string
          enum: [QUOTATION, PROFORMA, TAX_INVOICE, SALE_CONFIRMATION]
          description: >
            Load-bearing, not decoration (R-89). A SALE_CONFIRMATION carries the
            same figures as a tax invoice and is not one, because on that
            dealership the DMS holds the series. A document that looked like a
            tax invoice and was not would have somebody claiming input credit
            against it.
        reference: { type: string }
        taxInvoiceNo: { type: ["string", "null"] }
        dmsInvoiceNo: { type: ["string", "null"] }
        documentDate: { type: string }
        factsOrigin:
          type: string
          enum: [MIRROR, FORM]
          description: >
            Where the facts came from (R-96). MIRROR is a deal row, however it
            arrived - API, exported report or scan, all of which are the same
            kind of thing by the time they are a row, and the row itself carries
            which. FORM is somebody typing the sale in. Nothing downstream reads
            this: it is here so the document can say where its facts came from,
            not so anything behaves differently because of it.
        dealerCode:
          type: ["string", "null"]
          description: >
            Null for a dealership with no manufacturer's system. A dealer code
            is the OEM's name for an outlet and a sub-dealer has never been
            given one.
        dealId: { type: string }
        customerName: { type: ["string", "null"] }
        customerMobile: { type: ["string", "null"] }
        customerAddress: { type: ["string", "null"] }
        customerGstin: { type: ["string", "null"] }
        modelDescription: { type: ["string", "null"] }
        chassisNo: { type: ["string", "null"] }
        engineNo: { type: ["string", "null"] }
        hsn: { type: ["string", "null"] }
        priceOrigin:
          type: string
          enum: [LIST, STATED]
          description: >
            STATED means the figures were typed onto this document rather than
            looked up, which is what a dealership has before it has a price
            list. Said out loud in the same voice as pricedOffCurrentList.
        priceListId: { type: ["integer", "null"] }
        priceListName: { type: ["string", "null"] }
        priceListEffectiveFrom: { type: ["string", "null"] }
        pricedOffCurrentList:
          type: string
          enum: [Y, N]
          description: >
            N means the list used was not the current one, which is lawful and
            printed on the document. Hiding it would be the product concealing
            the dealer's own commercial decision from the customer it was made
            for.
        exShowroomAmount: { type: string }
        dealerDiscount: { type: string }
        oemSchemeAmount: { type: string }
        oemSchemePassedOn: { type: string }
        taxableAmount: { type: string }
        gstRatePct: { type: string }
        cessRatePct: { type: string }
        cgstAmount: { type: string }
        sgstAmount: { type: string }
        igstAmount: { type: string }
        cessAmount: { type: string }
        otherCharges:
          oneOf:
            - type: array
              items:
                type: object
                properties:
                  label: { type: string }
                  amount: { type: number }
                required: [label, amount]
            - type: "null"
        otherChargesTotal: { type: string }
        totalAmount: { type: string }
        sellerLegalName: { type: ["string", "null"] }
        sellerGstin: { type: ["string", "null"] }
        placeOfSupply: { type: ["string", "null"] }
        status:
          type: string
          enum: [DRAFT, ISSUED, CANCELLED]
        cancelledReason: { type: ["string", "null"] }
        issuedByName: { type: ["string", "null"] }
        createdAt: { type: string }
      required:
        [id, kind, reference, documentDate, factsOrigin, dealId, priceOrigin,
         pricedOffCurrentList, exShowroomAmount, taxableAmount, totalAmount, status]

    DocumentCancelInput:
      type: object
      properties:
        reason: { type: string }
      required: [reason]

    OemClaims:
      type: object
      properties:
        documents:
          type: array
          items:
            type: object
            properties:
              reference: { type: string }
              dealId: { type: string }
              modelDescription: { type: ["string", "null"] }
              schemeAmount: { type: number }
              passedOn: { type: number }
              retained: { type: number }
              documentDate: { type: string }
            required: [reference, dealId, schemeAmount, passedOn, retained, documentDate]
        totalClaimable:
          type: number
          description: The full scheme on every unit, because that is what is owed.
        totalRetained: { type: number }
      required: [documents, totalClaimable, totalRetained]

    PriceList:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        source:
          type: string
          enum: [OEM, DEALER]
        effectiveFrom: { type: string }
        effectiveTo: { type: ["string", "null"] }
        showroomId:
          type: ["integer", "null"]
          description: Null is the whole group's. An outlet's own list outranks it.
        models: { type: integer }
      required: [id, name, source, effectiveFrom, models]

    IngestPath:
      type: string
      enum: [API, REPORT, DOCUMENT]
      description: >
        API is a live integration. REPORT is a file the dealer exports from their
        own system and drops here. DOCUMENT is a scan, read one record at a time.
        Not a fallback chain — a dealership picks one per data type and it is
        theirs.

    IngestSource:
      type: object
      properties:
        dataType: { type: string }
        path: { $ref: "#/components/schemas/IngestPath" }
        enabled:
          type: boolean
          description: >
            Off is a real state. A dealership part-way through onboarding has
            three of the seven on, and the four that are not must read as "not
            connected" rather than as "nothing to show".
        lastIngestedAt: { type: ["string", "null"] }
      required: [dataType, path, enabled]

    IngestSourceInput:
      type: object
      properties:
        showroomId: { type: integer }
        dataType: { type: string }
        path: { $ref: "#/components/schemas/IngestPath" }
        enabled: { type: boolean }
      required: [showroomId, dataType, path]

    ReportDropInput:
      type: object
      properties:
        showroomId: { type: integer }
        dataType:
          type: string
          default: DEAL
        filename: { type: ["string", "null"] }
        text:
          type: string
          description: The exported file, as text. Comma, tab or semicolon separated.
      required: [showroomId, text]

    MappedColumn:
      type: object
      properties:
        column: { type: string }
        confidence:
          type: number
          description: >
            How sure the proposal is. A name match is 0.98; a model reading an
            unfamiliar heading is capped at 0.8, because a good guess about a
            heading nobody has seen is not the same kind of fact as "Chassis No"
            meaning the chassis number. The confirmation screen sorts by this.
      required: [column, confidence]

    ReportDropResult:
      type: object
      properties:
        batchId: { type: integer }
        status:
          type: string
          enum: [PENDING_MAPPING, ACCEPTED, REJECTED]
        mappingId: { type: integer }
        mappingStatus:
          type: string
          enum: [PROPOSED, CONFIRMED, REJECTED]
        headings:
          type: array
          items: { type: string }
        mapping:
          type: object
          additionalProperties: { $ref: "#/components/schemas/MappedColumn" }
        wasKnown:
          type: boolean
          description: This export's shape had been confirmed before.
        usedModel:
          type: boolean
          description: >
            Whether a model was called to read the headings. The number this
            objective is measured on — false on every file after the first of a
            given shape.
        gaps:
          type: array
          items: { type: string }
          description: Required fields the mapping still cannot fill.
        rowsSeen: { type: integer }
        rowsAccepted: { type: integer }
        rowsRejected: { type: integer }
        rejections:
          type: array
          items: { type: string }
          description: >
            The first few reasons. A mapping that rejects three hundred rows needs
            three examples and a count, not three hundred sentences.
      required:
        [batchId, status, mappingId, mappingStatus, headings, mapping, wasKnown,
         usedModel, gaps, rowsSeen, rowsAccepted, rowsRejected, rejections]

    MappingConfirmInput:
      type: object
      properties:
        mapping:
          type: object
          additionalProperties: { $ref: "#/components/schemas/MappedColumn" }
          description: Corrections made on the screen, replacing the proposal wholesale.
        text:
          type: string
          description: The file again, so a held batch can be released rather than re-uploaded.

    MappingConfirmResult:
      type: object
      properties:
        mapping:
          type: object
          properties:
            id: { type: integer }
            status: { type: string }
            mapping:
              type: object
              additionalProperties: { $ref: "#/components/schemas/MappedColumn" }
            confirmedByName: { type: ["string", "null"] }
            usedCount: { type: integer }
          required: [id, status, mapping, usedCount]
        released:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              rowsAccepted: { type: integer }
            required: [id, rowsAccepted]
      required: [mapping, released]

    IngestBatch:
      type: object
      properties:
        id: { type: integer }
        dataType: { type: string }
        path: { $ref: "#/components/schemas/IngestPath" }
        filename: { type: ["string", "null"] }
        status: { type: string }
        rowsSeen: { type: integer }
        rowsAccepted: { type: integer }
        rowsRejected: { type: integer }
        rejections:
          oneOf:
            - type: array
              items: { type: string }
            - type: "null"
        mappingId: { type: ["integer", "null"] }
        uploadedByName: { type: ["string", "null"] }
        createdAt: { type: string }
      required: [id, dataType, path, status, rowsSeen, rowsAccepted, rowsRejected, createdAt]

    CaseField:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        value: { type: ["string", "null"] }
        origin:
          type: string
          enum: [MIRROR, DDMS, META]
          description: >
            MIRROR is the manufacturer's, pulled and never written back. DDMS is
            what this product concluded. META is sync bookkeeping.
      required: [key, label, origin]

    CaseRecord:
      type: object
      properties:
        module: { type: string }
        recordKey: { type: string }
        title: { type: string }
        subtitle: { type: ["string", "null"] }
        fields:
          type: array
          items: { $ref: "#/components/schemas/CaseField" }
        provenance:
          type: object
          properties:
            path: { type: ["string", "null"] }
            confidence:
              oneOf:
                - type: object
                  additionalProperties: { type: number }
                - type: "null"
        lastSyncedAt: { type: ["string", "null"] }
        disappearedFromDms: { type: boolean }
      required: [module, recordKey, title, fields, disappearedFromDms]

    HistoryEntry:
      type: object
      properties:
        at: { type: string }
        clock:
          type: string
          enum: [THEIRS, WE_NOTICED, SOMEBODY_HERE, THE_AGENT, THE_CUSTOMER]
          description: >
            Which clock this entry is on. THEIRS is the dealer's own system,
            WE_NOTICED is when a sync read it, and the last three are people.
            Merging them into one timeline column would be the easy version and
            it would lie.
        clockNote:
          type: string
          description: The clock in words, so no screen has to know the enum.
        kind:
          type: string
          enum:
            [
              FIRST_SEEN,
              THEIR_CHANGE,
              STATE_MOVED,
              DECISION,
              ACTIVITY,
              MESSAGE_SENT,
              MESSAGE_HELD,
              REPLY,
            ]
        who: { type: ["string", "null"] }
        headline: { type: string }
        detail: { type: ["string", "null"] }
        source:
          type: object
          properties:
            table: { type: string }
            id: { type: integer }
          required: [table, id]
        tried:
          type: boolean
          description: >
            Whether this counts as somebody actually trying to move the record
            along. A held draft is not one, and neither is a retracted call — a
            withdrawn claim must not leave a manager believing the customer has
            been spoken to.
        retracted: { type: boolean }
      required: [at, clock, clockNote, kind, headline, source, tried, retracted]

    RecordOwner:
      type: object
      properties:
        empCode: { type: ["string", "null"] }
        name: { type: ["string", "null"] }
        origin:
          type: ["string", "null"]
          enum: [MIRROR, DDMS, null]
          description: >
            MIRROR is whoever the dealer's system names. DDMS is a handover
            recorded here, which their system does not know about.
        stillHere:
          type: ["boolean", "null"]
          description: >
            False when the staff master gives a leaving date. **Null when we
            cannot say** — an employee code the roster has never heard of is a
            keying error, not a departure, and reporting it as one would send a
            manager to reassign work that is fine. It can never say whether
            somebody came in this morning; no DMS carries attendance.
        note: { type: string }
      required: [note]

    RecordHistory:
      type: object
      properties:
        module: { type: string }
        recordKey: { type: string }
        showroomId:
          type: integer
          description: >
            Which outlet the record is at, read off the mirror row. Returned
            rather than asked for, so every control on the page has it without
            digging it out of the field list.
        entries:
          type: array
          items: { $ref: "#/components/schemas/HistoryEntry" }
        tried:
          type: array
          items: { $ref: "#/components/schemas/HistoryEntry" }
          description: The subset that is somebody trying to move it along.
        owner: { $ref: "#/components/schemas/RecordOwner" }
        knownSince:
          type: ["string", "null"]
          description: >
            How far back this history can see, which is not the record's
            beginning.
        inCurrentStateSince: { type: ["string", "null"] }
        currentState: { type: ["string", "null"] }
        limits:
          type: array
          items: { type: string }
      required: [module, recordKey, showroomId, entries, tried, owner, limits]

    JourneyTrace:
      type: object
      properties:
        id: { type: integer }
        definitionId: { type: string }
        definitionVersion:
          type: integer
          description: >
            Which version of the map this journey started under. A trace read next
            year against a map that has since gained two steps would be a quietly
            false account of what somebody was asked to do.
        title: { type: string }
        subjectModule: { type: string }
        subjectKey: { type: string }
        status:
          type: string
          enum: [LIVE, DONE, ABANDONED]
          description: >
            ABANDONED is not DONE. The thing the journey was about stopped
            existing, which must never be counted as having finished.
        startedAt: { type: string }
        completedAt: { type: ["string", "null"] }
        steps:
          type: array
          items:
            $ref: "#/components/schemas/JourneyTraceStep"
        standingOn:
          type: ["string", "null"]
          description: Null on a finished journey.
        wait:
          oneOf:
            - $ref: "#/components/schemas/JourneyWait"
            - type: "null"
        loops:
          type: integer
          description: How many times the outside world sent it backwards.
        arrivals:
          type: array
          items:
            $ref: "#/components/schemas/JourneyArrival"
      required:
        [id, definitionId, definitionVersion, title, subjectModule, subjectKey,
         status, startedAt, steps, loops, arrivals]

    JourneyTraceStep:
      type: object
      properties:
        stepId: { type: string }
        title: { type: string }
        actor:
          type: string
          enum: [RULE, PERSON, AGENT, OUTSIDE, DMS]
          description: >
            Who physically moves it. OUTSIDE is the RTO, the customer, India Post —
            nobody the dealership employs, and the distinction decides whether a
            row is work or news.
        state:
          type: string
          enum: [DONE, HERE, AHEAD]
      required: [stepId, title, actor, state]

    JourneyWait:
      type: object
      properties:
        kind:
          type: string
          enum: [PERSON, OUTSIDE, JOURNEY, TIME]
          description: >
            The four kinds of waiting, and DDMS could express none of them before.
            PERSON is always work. OUTSIDE is work only once it has gone on too
            long. JOURNEY means another process must finish first — insurance,
            before registration can move. TIME is never work, and saying so is the
            point: a file lodged on Tuesday is not late on Wednesday.
        who: { type: string }
        why: { type: string }
        todo: { type: string }
        notBefore:
          type: ["string", "null"]
          description: The day an OUTSIDE wait stops being normal and starts being late.
        tone:
          type: string
          enum: [PROBLEM, OPPORTUNITY]
      required: [kind, who, why, todo]

    JourneyArrival:
      type: object
      properties:
        stepId: { type: string }
        direction:
          type: string
          enum: [START, FORWARD, BACKWARD, FINISH]
        reason:
          type: ["string", "null"]
          description: >
            Why, in the world's words — the RTO's objection text. A BACKWARD
            arrival without one is the failure the ledger exists to prevent.
        fromStepId: { type: ["string", "null"] }
        occurredAt: { type: string }
      required: [stepId, direction, occurredAt]

    RecordActivity:
      type: object
      properties:
        id: { type: integer }
        ownerId: { type: integer }
        showroomId: { type: integer }
        module:
          type: string
          enum: [DEAL, JOB_CARD, ENQUIRY, REGISTRATION, PART, RECEIVABLE, VEHICLE]
        recordKey: { type: string }
        kind:
          type: string
          enum: [NOTE, CALL, VISIT, MESSAGE, OBSERVED, INBOUND, SYSTEM]
          description: >
            NOTE is somebody's thought. CALL, VISIT and MESSAGE assert a person did
            something outside the system and only a person may write them. OBSERVED
            is the system recording what it checked — an agent may write this
            because it is what the agent did. INBOUND is the customer speaking,
            written when a reply arrives. SYSTEM is housekeeping.
        body: { type: string }
        userId:
          type: ["integer", "null"]
          description: Null means the agent wrote it — the system did this, not we lost track of who.
        authorName: { type: ["string", "null"] }
        authoredBy:
          type: string
          enum: [PERSON, AGENT]
        retractedAt: { type: ["string", "null"] }
        retractedByUserId: { type: ["integer", "null"] }
        retractedReason: { type: ["string", "null"] }
        createdAt: { type: string }
      required: [id, ownerId, showroomId, module, recordKey, kind, body, authoredBy, createdAt]

    ActivityInput:
      type: object
      properties:
        showroomId: { type: integer }
        kind:
          type: string
          enum: [NOTE, CALL, VISIT, MESSAGE, OBSERVED]
          description: >
            INBOUND and SYSTEM are absent on purpose. INBOUND is written by the
            transport that received the reply, never composed by a caller; SYSTEM
            from a person is recorded as NOTE, because the distinction being kept
            is who noticed.
        body:
          type: string
          maxLength: 2000
      required: [showroomId, body]

    Task:
      type: object
      properties:
        id: { type: integer }
        ownerId: { type: integer }
        showroomId: { type: integer }
        title: { type: string }
        detail: { type: ["string", "null"] }
        module:
          type: ["string", "null"]
          description: Null for a standing job that belongs to no single record.
        recordKey: { type: ["string", "null"] }
        assignedEmpCode: { type: ["string", "null"] }
        assignedEmpName: { type: ["string", "null"] }
        dueOn:
          type: ["string", "null"]
          description: A date, not a timestamp. Dealerships work in days.
        status:
          type: string
          enum: [OPEN, DONE, CANCELLED]
        source:
          type: string
          enum: [PERSON, AGENT, JOURNEY]
          description: >
            Changes what closing it means. A JOURNEY task closes when the journey
            moves on; PERSON and AGENT tasks close only when a person says so.
        createdByUserId: { type: ["integer", "null"] }
        createdByName: { type: ["string", "null"] }
        completedAt: { type: ["string", "null"] }
        completedByUserId: { type: ["integer", "null"] }
        outcome: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
      required: [id, ownerId, showroomId, title, status, source, createdAt, updatedAt]

    ActivityRetractInput:
      type: object
      description: Why it was withdrawn. Kept on the row and shown beside it.
      properties:
        reason: { type: string }

    TaskCloseInput:
      type: object
      properties:
        status:
          type: string
          enum: [DONE, CANCELLED]
        outcome:
          type: string
          description: What was actually done, or why it was dropped. Both worth keeping.

    TaskInput:
      type: object
      properties:
        showroomId: { type: integer }
        title:
          type: string
          maxLength: 200
        detail: { type: string }
        module:
          type: string
          enum: [DEAL, JOB_CARD, ENQUIRY, REGISTRATION, PART, RECEIVABLE, VEHICLE]
        recordKey: { type: string }
        assignedEmpCode:
          type: string
          description: Must still work here. A task on a departed employee is a task nobody will do.
        dueOn:
          type: string
          description: YYYY-MM-DD.
      required: [showroomId, title]

    MessageEditInput:
      type: object
      description: >
        The text as it should go. Send the whole message rather than a patch — the
        person editing has read the whole message, and that is the unit approval is
        given over.
      properties:
        body:
          type: string
          maxLength: 4000
        subject:
          type: ["string", "null"]
          description: Omit to leave it as it is. Null clears it, as on WhatsApp and SMS.
      required: [body]

    MessageGate:
      type: object
      description: What would happen if somebody pressed send right now.
      properties:
        ok: { type: boolean }
        basis:
          type: string
          enum: [RULE, PERSON]
        rule: { type: string }
        userId: { type: integer }
        reason:
          type: string
          description: Present when ok is false. Why it may not go.
      required: [ok]

    MessageWithGate:
      type: object
      properties:
        message:
          $ref: "#/components/schemas/OutboundMessage"
        gate:
          $ref: "#/components/schemas/MessageGate"
      required: [message, gate]

    DraftMessageResponse:
      type: object
      properties:
        message:
          $ref: "#/components/schemas/OutboundMessage"
        reused:
          type: boolean
          description: True when an open draft already existed and was returned unchanged.
        rationale:
          type: string
          description: Why this message exists, for the person deciding whether to approve it.
        gate:
          $ref: "#/components/schemas/MessageGate"
      required: [message, reused, rationale, gate]

    OutboxRow:
      type: object
      properties:
        message:
          $ref: "#/components/schemas/OutboundMessage"
        gate:
          $ref: "#/components/schemas/MessageGate"
      required: [message, gate]

    OutboxSummary:
      type: object
      properties:
        drafts: { type: integer }
        awaitingApproval:
          type: integer
          description: Drafts no rule permits — somebody has to read these.
        approvedNotSent: { type: integer }
        held:
          type: integer
          description: Authorised, but no transport is configured, so nothing was delivered.
        sent: { type: integer }
        ruleWouldSend:
          type: integer
          description: Drafts a rule would send right now with nobody reading them.
      required: [drafts, awaitingApproval, approvedNotSent, held, sent, ruleWouldSend]

    ExplainInput:
      type: object
      properties:
        module:
          $ref: "#/components/schemas/ExplainModule"
        showroomId: { type: integer }
        recordKey:
          type: string
          description: The mirror row's own key — jcNo, enqId, regnFileNo, partNo.
      required: [module, showroomId, recordKey]

    ExplainModule:
      type: string
      enum: [JOB_CARD, ENQUIRY, REGISTRATION, PART, RECEIVABLE, VEHICLE]

    Evidence:
      type: object
      description: One tool call and the rows it returned. This is the citation.
      properties:
        tool: { type: string }
        looked:
          type: string
          description: What this tool went and looked at, for the person reading.
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
      required: [tool, looked, rows]

    Explanation:
      type: object
      properties:
        module:
          $ref: "#/components/schemas/ExplainModule"
        recordKey: { type: string }
        state:
          type: ["string", "null"]
          description: The module's own classification, carried through untouched.
        summary:
          type: ["string", "null"]
          description: >
            A model's reading of the findings, present only when it passed the
            citation check. The panel is complete without it.
        findings:
          type: array
          items: { type: string }
          description: One sentence per claim, each assembled by a rule from an evidence row.
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
        narrationRejected:
          type: ["string", "null"]
          description: Why a model's wording was refused, when one was.
      required: [module, recordKey, findings, evidence]

    ReceivableState:
      type: string
      enum: [DISPUTED, PROMISE_BROKEN, UNCHASED, BEING_CHASED, DUE_SOON, CURRENT, SETTLED]
      description: >
        Causes, not consequences. Ageing lives on the row as `daysOverdue`
        because a bill is not overdue *because* it is old — it is old because
        nobody chased it, they broke a promise, or it is disputed, and those need
        different people to do different things.

    PartyExposure:
      type: object
      description: What one party owes across every outlet the owner holds.
      properties:
        partyCode: { type: string }
        partyName: { type: string }
        outlets:
          type: array
          items:
            type: object
            properties:
              showroomId: { type: integer }
              showroomCode: { type: ["string", "null"] }
              balance: { type: number }
              open: { type: integer }
            required: [showroomId, balance, open]
        totalBalance: { type: number }
        outletCount: { type: integer }
      required: [partyCode, partyName, outlets, totalBalance, outletCount]

    ReceivablesWorklistRow:
      type: object
      properties:
        receivableId: { type: string }
        dealerCode: { type: string }
        showroomId: { type: integer }
        showroomCode: { type: ["string", "null"] }
        partyType: { type: string }
        partyCode: { type: string }
        partyName: { type: string }
        partyEmail:
          type: ["string", "null"]
          description: Null for a walk-in customer, and that is why a statement cannot always go.
        dms:
          type: object
          properties:
            invoiceNo: { type: string }
            invoiceDate: { type: ["string", "null"] }
            invoiceAmount: { type: ["number", "null"] }
            receivedAmount: { type: ["number", "null"] }
            dueDate: { type: ["string", "null"] }
            againstType: { type: ["string", "null"] }
            againstKey: { type: ["string", "null"] }
            narration: { type: ["string", "null"] }
            status: { type: string }
            lastReceiptDate: { type: ["string", "null"] }
            promisedDate: { type: ["string", "null"] }
          required: [invoiceNo, status]
        ddms:
          type: object
          properties:
            chasedAt: { type: ["string", "null"] }
            disputedAt: { type: ["string", "null"] }
            disputeNote: { type: ["string", "null"] }
        state:
          $ref: "#/components/schemas/ReceivableState"
        note: { type: ["string", "null"] }
        actionRequired: { type: ["string", "null"] }
        balance: { type: number }
        daysOverdue: { type: integer }
        ageDays: { type: integer }
        groupExposure:
          oneOf:
            - $ref: "#/components/schemas/PartyExposure"
            - type: "null"
          description: Present only when this party owes at more than one outlet.
        lastSyncedAt: { type: string }
        disappearedFromDms: { type: boolean }
      required: [receivableId, showroomId, partyType, partyCode, partyName, dms, ddms, state, balance, daysOverdue, ageDays, lastSyncedAt, disappearedFromDms]

    ReceivablesWorklistSummary:
      type: object
      properties:
        total: { type: integer }
        byState:
          type: object
          additionalProperties: { type: integer }
        needsAction: { type: integer }
        outstanding: { type: number }
        overdue:
          type: number
          description: Outstanding and past its due date. The number that should be zero.
        worstDaysOverdue: { type: integer }
        largestGroupExposure:
          type: ["object", "null"]
          properties:
            partyName: { type: string }
            totalBalance: { type: number }
            outletCount: { type: integer }
          description: >
            Null when no party owes at more than one outlet, in which case the
            figure would be a branch number wearing a group label.
        lastSyncedAt: { type: ["string", "null"] }
      required: [total, byState, needsAction, outstanding, overdue, worstDaysOverdue]

    InventoryState:
      type: string
      enum: [WANTED_NOW, STUCK_ALLOCATION, AGEING_SEVERE, AGEING, OFFERED, FRESH, SOLD]

    MatchingEnquiry:
      type: object
      description: An open enquiry for this exact model, at any outlet the owner holds.
      properties:
        enqId: { type: string }
        showroomId: { type: integer }
        showroomCode: { type: ["string", "null"] }
        customerName: { type: ["string", "null"] }
        customerMobile: { type: ["string", "null"] }
        stage: { type: string }
        grade: { type: ["string", "null"] }
        enquiredAt: { type: ["string", "null"] }
        otherOutlet:
          type: boolean
          description: True when the person asking is at a different outlet from the vehicle.
      required: [enqId, showroomId, stage, otherOutlet]

    InventoryWorklistRow:
      type: object
      properties:
        chassisNo: { type: string }
        dealerCode: { type: string }
        showroomId: { type: integer }
        showroomCode: { type: ["string", "null"] }
        modelCode: { type: string }
        modelDescription: { type: ["string", "null"] }
        variantDescription: { type: ["string", "null"] }
        colourDescription: { type: ["string", "null"] }
        dms:
          type: object
          properties:
            engineNo: { type: ["string", "null"] }
            status: { type: string }
            allocatedDealId: { type: ["string", "null"] }
            costAmount: { type: ["number", "null"] }
            isFinanced: { type: boolean }
            interestRatePct: { type: ["number", "null"] }
            receivedDate: { type: ["string", "null"] }
            allocatedDate: { type: ["string", "null"] }
            invoicedDate: { type: ["string", "null"] }
          required: [status, isFinanced]
        ddms:
          type: object
          properties:
            offeredToEnqId: { type: ["string", "null"] }
            offeredAt: { type: ["string", "null"] }
            transferProposedAt: { type: ["string", "null"] }
            transferToShowroomId: { type: ["integer", "null"] }
        state:
          $ref: "#/components/schemas/InventoryState"
        note: { type: ["string", "null"] }
        actionRequired: { type: ["string", "null"] }
        ageDays: { type: integer }
        allocatedDays: { type: ["integer", "null"] }
        interestPerDay: { type: ["number", "null"] }
        interestAccrued: { type: ["number", "null"] }
        matchingEnquiryCount:
          type: integer
          description: >
            How many open enquiries there are for this model — which is NOT the
            length of the list below. That list is capped for display, and the
            cap used to be reported as the count.
        matchingEnquiries:
          type: array
          items:
            $ref: "#/components/schemas/MatchingEnquiry"
        lastSyncedAt: { type: string }
        disappearedFromDms: { type: boolean }
      required: [chassisNo, showroomId, modelCode, dms, ddms, state, ageDays, matchingEnquiries, lastSyncedAt, disappearedFromDms]

    InventoryWorklistSummary:
      type: object
      properties:
        total: { type: integer }
        byState:
          type: object
          additionalProperties: { type: integer }
        needsAction: { type: integer }
        capitalTiedUp: { type: number }
        interestAccrued: { type: number }
        interestPerDay:
          type: number
          description: What another day of doing nothing costs, across the floor.
        wanted:
          type: integer
          description: Units somebody is actively asking for. The one to lead with.
        oldestDays: { type: integer }
        lastSyncedAt: { type: ["string", "null"] }
      required: [total, byState, needsAction, capitalTiedUp, interestAccrued, interestPerDay, wanted, oldestDays]

    EventModule:
      type: string
      enum: [DEAL, JOB_CARD, ENQUIRY, REGISTRATION, PART, RECEIVABLE, VEHICLE]

    RecordEvent:
      type: object
      properties:
        id: { type: integer }
        ownerId: { type: integer }
        showroomId: { type: integer }
        module:
          $ref: "#/components/schemas/EventModule"
        recordKey: { type: string }
        fromState:
          type: ["string", "null"]
          description: Null means first classified, which is not the same as changed.
        toState: { type: string }
        detectedAt:
          type: string
          description: >
            When it was detected, not when it happened. A file that lapsed at
            midnight is found at the next sync, so this is bounded above by the
            scheduler's interval — calling it occurredAt would claim a precision
            the mirror cannot have.
      required: [id, ownerId, showroomId, module, recordKey, toState, detectedAt]

    StaffMember:
      type: object
      properties:
        empCode: { type: string }
        empName: { type: string }
        role: { type: string }
        mobileNo: { type: ["string", "null"] }
        emailId:
          type: ["string", "null"]
          description: Null once they have left, and null is what stops an internal email going.
        carrying:
          type: integer
          description: Live enquiries and registration files already on this person.
      required: [empCode, empName, role, carrying]

    EntityKind:
      type: string
      enum: [CUSTOMER, VEHICLE, EMPLOYEE]
      description: >
        Resolved on the last ten digits of a mobile number, on a normalised
        chassis number, and on `dealerCode:empCode` respectively. There is no
        fuzzy name matching — a dealership has four customers called Sharma, and
        merging them would be worse than merging none.

    EntityModule:
      type: string
      enum: [DEAL, JOB_CARD, ENQUIRY, REGISTRATION]

    EntitySearchRow:
      type: object
      properties:
        id: { type: integer }
        kind:
          $ref: "#/components/schemas/EntityKind"
        naturalKey: { type: string }
        displayName: { type: ["string", "null"] }
        confidence:
          type: number
          description: >
            1 for a vehicle or a member of staff — a chassis identifies exactly
            one machine. Lower for a customer, because a mobile number is a
            probable identity: families share a handset, numbers get reassigned,
            and switchboard numbers get typed into walk-in records.
        linkCount:
          type: integer
          description: How many mirror rows touch this entity. The reason to open it.
        modules:
          type: array
          items:
            $ref: "#/components/schemas/EntityModule"
      required: [id, kind, naturalKey, confidence, linkCount, modules]

    DossierRecord:
      type: object
      properties:
        module:
          $ref: "#/components/schemas/EntityModule"
        recordKey: { type: string }
        role:
          type: string
          enum: [SUBJECT, VEHICLE, ADVISOR, ASSIGNEE, AGENT]
        showroomId: { type: integer }
        showroomCode: { type: ["string", "null"] }
        title: { type: string }
        state:
          type: string
          description: >
            Taken from the module's own classifier. `GONE_FROM_DMS` means the
            mirror row vanished since the graph was built — said plainly rather
            than left blank.
        note: { type: ["string", "null"] }
        actionRequired: { type: ["string", "null"] }
        ageDays: { type: ["integer", "null"] }
        href: { type: string }
      required: [module, recordKey, role, showroomId, title, state, href]

    EntityDossier:
      type: object
      properties:
        entity:
          type: object
          properties:
            id: { type: integer }
            kind:
              $ref: "#/components/schemas/EntityKind"
            naturalKey: { type: string }
            displayName: { type: ["string", "null"] }
            confidence: { type: number }
          required: [id, kind, naturalKey, confidence]
        identityNote:
          type: ["string", "null"]
          description: >
            Present when identity is probable rather than certain, so a reader
            deciding whether to act knows how the match was made.
        showrooms:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              code: { type: ["string", "null"] }
            required: [id]
        records:
          type: array
          items:
            $ref: "#/components/schemas/DossierRecord"
        summary:
          type: object
          properties:
            total: { type: integer }
            needsAction: { type: integer }
            modules:
              type: array
              items:
                $ref: "#/components/schemas/EntityModule"
            showroomCount:
              type: integer
              description: Outlets this one person or vehicle appears at. Two is the finding.
          required: [total, needsAction, modules, showroomCount]
      required: [entity, showrooms, records, summary]

    SparesState:
      type: string
      enum:
        [AVAILABLE_ELSEWHERE, STOCKOUT_BLOCKING, ORDER_OVERDUE, BELOW_REORDER,
         FULLY_RESERVED, DEAD_STOCK, OK]
      description: >
        AVAILABLE_ELSEWHERE is the one that justifies the module: a customer is
        waiting for a part the company already owns, on a shelf in another
        outlet, and neither branch's system can see the other's. Everything else
        here a good storeman would eventually catch on their own screen.

        FULLY_RESERVED is the quiet one. The shelf holds four and every one is
        promised to an open job card, so the counter can issue none — and only
        the first of those numbers is on the storeman's screen.

    SparesWorklistRow:
      type: object
      properties:
        partNo: { type: string }
        partDesc: { type: ["string", "null"] }
        showroomId: { type: integer }
        showroomCode: { type: ["string", "null"] }
        dealerCode: { type: string }
        binLocation: { type: ["string", "null"] }
        dms:
          type: object
          description: What this branch's own ledger holds.
          properties:
            qtyOnHand: { type: integer }
            qtyReserved: { type: integer }
            qtyFree:
              type: integer
              description: On hand minus reserved. What the counter can issue today.
            reorderLevel: { type: integer }
            mrpAmount: { type: ["number", "null"] }
            costAmount: { type: ["number", "null"] }
            lastReceivedDate: { type: ["string", "null"] }
            lastIssuedDate: { type: ["string", "null"] }
            onOrderQty: { type: integer }
            onOrderEtaDate: { type: ["string", "null"] }
          required: [qtyOnHand, qtyReserved, qtyFree, reorderLevel, onOrderQty]
        ddms:
          type: object
          description: >
            Ours. An inter-branch transfer is not an event either branch's
            system has a concept of, because each one only knows its own shelf.
          properties:
            transferRequestedAt: { type: ["string", "null"] }
            transferFromShowroomId: { type: ["integer", "null"] }
            reorderRaisedAt: { type: ["string", "null"] }
          required: [transferRequestedAt, transferFromShowroomId, reorderRaisedAt]
        waitingJobCards:
          type: array
          description: Open job cards at this outlet held up on this exact part.
          items:
            type: object
            properties:
              jcNo: { type: string }
              customerName: { type: ["string", "null"] }
              daysWaiting: { type: integer }
            required: [jcNo, daysWaiting]
        availableAt:
          type: array
          description: The same part, free, at another outlet this owner holds.
          items:
            type: object
            properties:
              showroomId: { type: integer }
              showroomCode: { type: ["string", "null"] }
              qtyFree: { type: integer }
              binLocation: { type: ["string", "null"] }
            required: [showroomId, qtyFree]
        shortAt:
          type: array
          description: >
            The same part, at or below its reorder level, at another outlet.
            The inverse finding: eight pads nobody here has ever issued are not
            a write-off if the branch that sells the model is about to buy more.
          items:
            type: object
            properties:
              showroomId: { type: integer }
              showroomCode: { type: ["string", "null"] }
              qtyFree: { type: integer }
              reorderLevel: { type: integer }
              onOrderQty: { type: integer }
            required: [showroomId, qtyFree, reorderLevel, onOrderQty]
        state:
          $ref: "#/components/schemas/SparesState"
        note: { type: ["string", "null"] }
        actionRequired: { type: ["string", "null"] }
        daysSinceIssued: { type: ["integer", "null"] }
        idleCapital:
          type: ["number", "null"]
          description: Cost of stock sitting still. What makes dead stock a decision.
        lastSyncedAt: { type: string }
      required:
        [partNo, showroomId, dealerCode, dms, ddms, waitingJobCards, availableAt,
         shortAt, state, lastSyncedAt]

    SparesWorklistSummary:
      type: object
      properties:
        total: { type: integer }
        byState:
          type: object
          additionalProperties: { type: integer }
        needsAction: { type: integer }
        availableElsewhere:
          type: integer
          description: >
            Customers waiting for a part the company already owns, in another
            outlet. No single branch's system can produce this number.
        stockoutBlocking: { type: integer }
        belowReorder: { type: integer }
        idleCapital:
          type: number
          description: Cost of stock that has not moved. Capital, not inventory.
        lastSyncedAt: { type: ["string", "null"] }
      required:
        [total, byState, needsAction, availableElsewhere, stockoutBlocking,
         belowReorder, idleCapital]

    RegistrationState:
      type: string
      enum:
        [OBJECTION, BLOCKED_NO_INSURANCE, AWAITING_DOCS, TAX_HELD, RC_IN_DRAWER,
         RTO_SILENT, HSRP_PENDING, ON_TRACK, CLOSED]
      description: >
        **Why** a registration file is not moving. Each has a different owner:
        the RTO, the insurance desk, the customer, accounts, the agent, us.

        A lapsed temporary registration is deliberately not one of these. It is
        a consequence rather than a cause — it raises the urgency of whatever
        the real blockage is — so it lives on the row as tempRegDaysLeft and in
        the note. An earlier draft made it a state, and a file the RTO had
        rejected whose temporary registration had also lapsed came out advising
        somebody to take it to the RTO, with the objection nowhere on screen.

        RC_IN_DRAWER is the quiet one: as far as the DMS is concerned the
        transaction finished when the number was allotted, and a plastic card
        the customer has never seen is in a drawer.

    RegistrationWorklistRow:
      type: object
      properties:
        regnFileNo: { type: string }
        dealerCode: { type: string }
        showroomId: { type: integer }
        showroomCode: { type: ["string", "null"] }
        dealId:
          type: string
          description: The sale this file belongs to, joining the desk to the deal.
        customerName: { type: ["string", "null"] }
        customerMobile: { type: ["string", "null"] }
        modelDescription: { type: ["string", "null"] }
        chassisNo: { type: ["string", "null"] }
        agentEmpCode: { type: ["string", "null"] }
        dms:
          type: object
          description: What the dealer's own system believes.
          properties:
            status: { type: string }
            openedDate: { type: ["string", "null"] }
            rtoCode: { type: ["string", "null"] }
            rtoOffice: { type: ["string", "null"] }
            tempRegNo: { type: ["string", "null"] }
            tempRegExpiryDate: { type: ["string", "null"] }
            policyNo:
              type: ["string", "null"]
              description: >
                Null is the most actionable value on this screen, and the only
                blockage the dealership can clear from its own desk.
            roadTaxAmount: { type: ["number", "null"] }
            roadTaxCollectedDate: { type: ["string", "null"] }
            roadTaxPaidDate: { type: ["string", "null"] }
            submittedDate: { type: ["string", "null"] }
            regNo: { type: ["string", "null"] }
            regDate: { type: ["string", "null"] }
            hsrpFittedDate: { type: ["string", "null"] }
            rcReceivedDate: { type: ["string", "null"] }
            rcDeliveredDate: { type: ["string", "null"] }
            objectionDesc: { type: ["string", "null"] }
            pendingDoc: { type: ["string", "null"] }
          required: [status]
        ddms:
          type: object
          description: Ours. The DMS has no column for either of these.
          properties:
            customerNotifiedAt: { type: ["string", "null"] }
            assignedAgentEmpCode:
              type: ["string", "null"]
              description: >
                Ours, and separate from the DMS's read-only agentEmpCode. A
                dealership with one RTO agent and forty open files has nowhere
                else to put "this one is yours today".
            rtoChasedAt:
              type: ["string", "null"]
              description: >
                Read as recency, not presence — a file lodged three weeks ago
                and chased yesterday is being handled; the same file chased once
                a fortnight back is not.
          required: [customerNotifiedAt, rtoChasedAt, assignedAgentEmpCode]
        state:
          $ref: "#/components/schemas/RegistrationState"
        note: { type: ["string", "null"] }
        actionRequired: { type: ["string", "null"] }
        ageDays:
          type: integer
          description: Days since the file was opened. On this screen age is severity.
        tempRegDaysLeft:
          type: ["integer", "null"]
          description: Negative means the vehicle is on the road unregistered.
        rcHeldDays: { type: ["integer", "null"] }
        taxHeldAmount:
          type: ["number", "null"]
          description: Collected from the customer and not yet remitted to the state.
        daysInStatus: { type: integer }
        lastSyncedAt: { type: string }
        disappearedFromDms: { type: boolean }
      required:
        [regnFileNo, dealerCode, showroomId, dealId, dms, ddms, state, ageDays,
         daysInStatus, lastSyncedAt, disappearedFromDms]

    RegistrationWorklistSummary:
      type: object
      properties:
        total: { type: integer }
        byState:
          type: object
          additionalProperties: { type: integer }
        needsAction: { type: integer }
        rcInDrawer:
          type: integer
          description: >
            Certificates the dealership is holding that their owners do not
            have. The number nobody could previously see.
        blockedOnInsurance:
          type: integer
          description: Files that cannot move until a policy exists.
        tempRegLapsed:
          type: integer
          description: Vehicles on the road with no valid registration at all.
        tempRegAtRisk:
          type: integer
          description: Temporary registrations expiring within the week.
        taxHeldAmount:
          type: number
          description: Customers' road tax sitting in the dealer's account, in rupees.
        oldestOpenDays: { type: integer }
        lastSyncedAt: { type: ["string", "null"] }
      required:
        [total, byState, needsAction, rcInDrawer, blockedOnInsurance,
         tempRegLapsed, tempRegAtRisk, taxHeldAmount, oldestOpenDays]

    DmsTenant:
      type: object
      description: >
        Resolved from the OEM's dealer code via showroom_dms_accounts. Null when
        that dealer code is not mapped to a showroom — a configuration gap, and
        reported as one rather than guessed at.
      properties:
        showroomId:
          type: integer
        showroomCode:
          type: string
        showroomName:
          type: string
        ownerId:
          type: integer
        ownerCode:
          type: string
        ownerName:
          type: string
        insuranceChannel:
          type: ["string", "null"]
          enum: [BROKER, DIRECT_AGENT, null]
          description: >
            How this showroom reaches insurers for deals from this DMS account.
            Held per account rather than per showroom because the arrangement
            belongs to the legal entity — one outlet may go through a broker
            platform while another holds its own agency code.
      required:
        - showroomId
        - showroomCode
        - showroomName
        - ownerId
        - ownerCode
        - ownerName

    DocumentField:
      type: object
      description: One labelled value, using the document's own printed label
      properties:
        label:
          type: string
          description: The label exactly as printed on the document
        value:
          type: string
        group:
          type: string
          enum: [vehicle, owner, rto, policy, other]
        confidence:
          type: number
      required:
        - label
        - value
        - group
        - confidence

    DocumentExtraction:
      type: object
      description: Stage 1 — what the document is and everything printed on it
      properties:
        documentType:
          type: string
          enum: [RC_BOOK, DEALER_INVOICE, AADHAAR, PAN, DRIVING_LICENCE, INSURANCE_POLICY, OTHER]
        documentTypeConfidence:
          type: number
        issuer:
          type: ["string", "null"]
        summary:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/DocumentField"
        rawText:
          type: ["string", "null"]
      required:
        - documentType
        - documentTypeConfidence
        - issuer
        - summary
        - fields

    DmsPullInput:
      type: object
      description: >
        Identifies the deal to pull. Deliberately not keyed on a registration
        number: under the Motor Vehicles Act an RTO will not register a vehicle
        without live insurance, so a new vehicle has no registration number at
        the moment the policy is bought. The keys that do exist at that point
        are the dealer's own deal identifier and the chassis number of the
        allocated stock unit. Supply at least one — dealId wins if both are
        given, because it resolves a whole deal rather than just a vehicle.
      properties:
        dealId:
          type: string
          description: >
            The dealer's own deal or booking identifier, e.g.
            HMC-DL-2026-000183. Preferred: a deal is customer plus vehicle plus
            finance, where a chassis is only the vehicle.
          minLength: 1
        chassisNo:
          type: string
          description: >
            Chassis number (VIN) of the allocated unit, e.g. MBLKAR0921NK18337.
            Present on Form 21 before any RC exists, and unlike a registration
            number it never changes on transfer or re-registration.
          minLength: 1
      minProperties: 1

    BrowserScrapeInput:
      type: object
      properties:
        url:
          type: string
          description: Dealer portal URL to scrape
          minLength: 1
        username:
          type: ["string", "null"]
          description: Optional login username for the portal
        password:
          type: ["string", "null"]
          description: Optional login password for the portal
      required:
        - url

    OcrInput:
      type: object
      properties:
        imageBase64:
          type: string
          description: Base64-encoded image (JPEG/PNG) or PDF content
        mimeType:
          type: string
          description: MIME type of the uploaded file, e.g. image/jpeg or application/pdf
        model:
          type: string
          enum: [auto, paddleocr, qwen-vl, olmocr, gpt-vision, gemini, openrouter, stub]
          description: >-
            Preferred OCR engine. "auto" (the default) walks the configured
            priority order. Naming an engine puts it first but still falls
            through to the rest unless allowFallback is false. The stub engine is
            never reached automatically — it must be named explicitly.
        allowFallback:
          type: boolean
          description: >-
            When false, only the named engine is tried and its failure is
            returned as-is. Defaults to true. Ignored when model is "auto".
      required:
        - imageBase64
        - mimeType

    OcrAttempt:
      type: object
      description: One engine attempt within a fallback chain
      properties:
        engineId:
          type: string
          enum: [paddleocr, qwen-vl, olmocr, gpt-vision, gemini, openrouter, stub]
        ok:
          type: boolean
        error:
          type: ["string", "null"]
        durationMs:
          type: number
      required:
        - engineId
        - ok
        - error
        - durationMs

    OcrEngineStatus:
      type: object
      description: An OCR engine's configuration and live availability
      properties:
        engineId:
          type: string
          enum: [paddleocr, qwen-vl, olmocr, gpt-vision, gemini, openrouter, stub]
        label:
          type: string
        priority:
          type: number
          description: Lower is tried first
        isEnabled:
          type: boolean
          description: Operator toggle, stored in the database
        isImplemented:
          type: boolean
          description: False for engines that are stubs pending real integration
        isConfigured:
          type: boolean
          description: True when the engine's API key is present in the environment
        isAvailable:
          type: boolean
          description: isEnabled AND isImplemented AND isConfigured
        autoEligible:
          type: boolean
          description: Whether this engine can be selected by the automatic chain
        statusReason:
          type: string
          description: Human-readable explanation of the current status
        requiredEnvVar:
          type: ["string", "null"]
      required:
        - engineId
        - label
        - priority
        - isEnabled
        - isImplemented
        - isConfigured
        - isAvailable
        - autoEligible
        - statusReason
        - requiredEnvVar

    UpdateOcrEnginesInput:
      type: object
      properties:
        engines:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              engineId:
                type: string
                enum: [paddleocr, qwen-vl, olmocr, gpt-vision, gemini, openrouter, stub]
              priority:
                type: number
              isEnabled:
                type: boolean
            required:
              - engineId
              - priority
              - isEnabled
      required:
        - engines

    IngestPushInput:
      type: object
      properties:
        fields:
          $ref: "#/components/schemas/MsaFields"
        document:
          description: >-
            Stage 1 extraction, stored against the application as an audit trail
            of what the OCR actually read. Optional — non-OCR sources omit it.
          oneOf:
            - $ref: "#/components/schemas/DocumentExtraction"
            - type: "null"
        tenant:
          description: >-
            Pass back the `tenant` block from a DMS pull so the draft is
            attributed to a showroom and therefore an owner. Omitted by OCR and
            scrape, which have no way of knowing which outlet they belong to —
            those fall back to `showroomId` below, and failing that to the
            signed-in person's own outlet.
          oneOf:
            - $ref: "#/components/schemas/DmsTenant"
            - type: "null"
        showroomId:
          type: ["integer", "null"]
          description: >-
            Which outlet an OCR or scrape draft belongs to. A photographed
            Aadhaar card cannot say, so the answer comes from the person holding
            the phone — their own outlet when they have one, and this field when
            they work across several. Ignored when `tenant` is present, which is
            a stronger statement than a picker.
        dealContext:
          type: object
          additionalProperties: true
          description: >-
            Pass back the `dealContext` block from a DMS pull. Everything the
            flat MSA payload has no room for — cubic capacity or motor kW,
            nominee, hypothecation, seating, manufacture date, entity type —
            lands in its own column from here. Without it the premium engine
            has no rating input and nothing can be priced.
      required:
        - fields

    IngestPushResult:
      type: object
      properties:
        applicationId:
          type: number
          description: ID of the newly created draft application in InsurRouter
      required:
        - applicationId

    RecentApplication:
      type: object
      properties:
        id:
          type: number
        ownerName:
          type: string
        vehicleMake:
          type: string
        vehicleModel:
          type: string
        providerName:
          type: ["string", "null"]
        status:
          type: string
          enum: [draft, validating, pending_confirmation, submitting, completed, failed]
        executionMode:
          type: string
          enum: [API, BROWSER, AUTO]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - ownerName
        - vehicleMake
        - vehicleModel
        - providerName
        - status
        - executionMode
        - createdAt
