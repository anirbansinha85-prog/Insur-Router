openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: InsurRouter API - Two-wheeler insurance application routing engine
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: providers
    description: Insurance provider management
  - name: applications
    description: Insurance application management
  - name: dashboard
    description: Dashboard analytics and summaries
  - name: ingest
    description: Document ingestion and MSA payload extraction (VeloDocs)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Providers ──────────────────────────────────────────────────────────────
  /providers:
    get:
      operationId: listProviders
      tags: [providers]
      summary: List all insurance providers
      responses:
        "200":
          description: List of providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Provider"
    post:
      operationId: createProvider
      tags: [providers]
      summary: Create a new insurance provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /providers/{id}:
    get:
      operationId: getProvider
      tags: [providers]
      summary: Get a provider by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Provider detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProvider
      tags: [providers]
      summary: Update a provider
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderUpdate"
      responses:
        "200":
          description: Updated provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProvider
      tags: [providers]
      summary: Delete a provider
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Applications ────────────────────────────────────────────────────────────
  /applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List all insurance applications
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, validating, pending_confirmation, submitting, completed, failed]
        - name: providerId
          in: query
          required: false
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
    post:
      operationId: createApplication
      tags: [applications]
      summary: Create a new insurance application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /applications/{id}:
    get:
      operationId: getApplication
      tags: [applications]
      summary: Get application with full MSA payload and logs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Application detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateApplication
      tags: [applications]
      summary: Update application data
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteApplication
      tags: [applications]
      summary: Delete an application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /applications/{id}/validate:
    post:
      operationId: validateApplication
      tags: [applications]
      summary: Validate the MSA payload strictly before submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /applications/{id}/execute:
    post:
      operationId: executeApplication
      tags: [applications]
      summary: Execute the insurance application submission (API or Browser mode)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutionRequest"
      responses:
        "200":
          description: Execution started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionResult"
        "400":
          description: Validation/state error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /applications/{id}/logs:
    get:
      operationId: getApplicationLogs
      tags: [applications]
      summary: Get submission execution logs for an application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Execution log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubmissionLog"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /applications/{id}/policy:
    get:
      operationId: getPolicy
      tags: [applications]
      summary: Get the generated policy for a completed application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Policy details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Ingest ──────────────────────────────────────────────────────────────────
  /ingest/dms-pull:
    post:
      operationId: ingestDmsPull
      tags: [ingest]
      summary: Pull vehicle data from Dealer DMS by registration number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DmsPullInput"
      responses:
        "200":
          description: Extracted MSA fields with confidence scores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ingest/browser-scrape:
    post:
      operationId: ingestBrowserScrape
      tags: [ingest]
      summary: Scrape vehicle data from a dealer portal URL using Playwright
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserScrapeInput"
      responses:
        "200":
          description: Extracted MSA fields with confidence scores and raw text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ingest/ocr:
    post:
      operationId: ingestOcr
      tags: [ingest]
      summary: Extract vehicle data from an RC book image or dealer invoice PDF via OCR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OcrInput"
      responses:
        "200":
          description: Extracted MSA fields with confidence scores and raw text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ingest/ocr/engines:
    get:
      operationId: listOcrEngines
      tags: [ingest]
      summary: List OCR engines with live availability and configured priority
      responses:
        "200":
          description: Engine status, ordered by priority
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OcrEngineStatus"
    put:
      operationId: updateOcrEngines
      tags: [ingest]
      summary: Set OCR engine priority order and enabled state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOcrEnginesInput"
      responses:
        "200":
          description: Updated engine status, ordered by priority
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OcrEngineStatus"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ingest/push:
    post:
      operationId: ingestPush
      tags: [ingest]
      summary: Push corrected MSA payload to InsurRouter as a draft application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestPushInput"
      responses:
        "201":
          description: Draft application created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestPushResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Dashboard ───────────────────────────────────────────────────────────────
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get aggregated stats for the dashboard
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/recent:
    get:
      operationId: getRecentApplications
      tags: [dashboard]
      summary: Get the most recent 10 applications with provider name
      responses:
        "200":
          description: Recent applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecentApplication"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    # ── Provider schemas ────────────────────────────────────────────────────
    Provider:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        code:
          type: string
          description: Short unique code, e.g. "HDFC", "BAJAJ"
        defaultExecutionMode:
          type: string
          enum: [API, BROWSER, AUTO]
        apiEndpoint:
          type: ["string", "null"]
          description: REST endpoint for API mode (null if not available)
        portalUrl:
          type: ["string", "null"]
          description: Dealer portal URL for browser automation mode
        isActive:
          type: boolean
        logoColor:
          type: ["string", "null"]
          description: Brand color hex for UI display
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - code
        - defaultExecutionMode
        - apiEndpoint
        - portalUrl
        - isActive
        - logoColor
        - createdAt
        - updatedAt

    ProviderInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 1
        defaultExecutionMode:
          type: string
          enum: [API, BROWSER, AUTO]
        apiEndpoint:
          type: ["string", "null"]
        portalUrl:
          type: ["string", "null"]
        isActive:
          type: boolean
        logoColor:
          type: ["string", "null"]
      required:
        - name
        - code
        - defaultExecutionMode

    ProviderUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 1
        defaultExecutionMode:
          type: string
          enum: [API, BROWSER, AUTO]
        apiEndpoint:
          type: ["string", "null"]
        portalUrl:
          type: ["string", "null"]
        isActive:
          type: boolean
        logoColor:
          type: ["string", "null"]

    # ── Application schemas ─────────────────────────────────────────────────
    VehicleDetails:
      type: object
      properties:
        make:
          type: string
        model:
          type: string
        variant:
          type: string
        engineNumber:
          type: string
        chassisNumber:
          type: string
        exShowroomPrice:
          type: number
        dateOfPurchase:
          type: string
          format: date
      required:
        - make
        - model
        - variant
        - engineNumber
        - chassisNumber
        - exShowroomPrice
        - dateOfPurchase

    OwnerKyc:
      type: object
      properties:
        fullName:
          type: string
        billingAddress:
          type: string
        pincode:
          type: number
        phoneNumber:
          type: number
        email:
          type: string
          
        dateOfBirth:
          type: string
          format: date
        idProofType:
          type: string
          enum: [AADHAR, PAN, PASSPORT, DRIVING_LICENSE, VOTER_ID]
        idProofNumber:
          type: string
      required:
        - fullName
        - billingAddress
        - pincode
        - phoneNumber
        - email
        - dateOfBirth
        - idProofType
        - idProofNumber

    RtoDetails:
      type: object
      properties:
        registrationCity:
          type: string
        registrationState:
          type: string
        rtoCode:
          type: string
      required:
        - registrationCity
        - registrationState
        - rtoCode

    Application:
      type: object
      properties:
        id:
          type: number
        status:
          type: string
          enum: [draft, validating, pending_confirmation, submitting, completed, failed]
        executionMode:
          type: string
          enum: [API, BROWSER, AUTO]
        resolvedExecutionMode:
          type: ["string", "null"]
          enum: [API, BROWSER, null]
        providerId:
          type: ["integer", "null"]
        providerName:
          type: ["string", "null"]
        vehicleMake:
          type: string
        vehicleModel:
          type: string
        ownerName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - status
        - executionMode
        - resolvedExecutionMode
        - providerId
        - providerName
        - vehicleMake
        - vehicleModel
        - ownerName
        - createdAt
        - updatedAt

    ApplicationDetail:
      type: object
      properties:
        id:
          type: number
        status:
          type: string
          enum: [draft, validating, pending_confirmation, submitting, completed, failed]
        executionMode:
          type: string
          enum: [API, BROWSER, AUTO]
        resolvedExecutionMode:
          type: ["string", "null"]
          enum: [API, BROWSER, null]
        providerId:
          type: ["integer", "null"]
        providerName:
          type: ["string", "null"]
        vehicleDetails:
          $ref: "#/components/schemas/VehicleDetails"
        ownerKyc:
          $ref: "#/components/schemas/OwnerKyc"
        rtoDetails:
          $ref: "#/components/schemas/RtoDetails"
        validationErrors:
          type: ["array", "null"]
          items:
            type: string
        logs:
          type: array
          items:
            $ref: "#/components/schemas/SubmissionLog"
        policy:
          oneOf:
            - $ref: "#/components/schemas/Policy"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - status
        - executionMode
        - resolvedExecutionMode
        - providerId
        - providerName
        - vehicleDetails
        - ownerKyc
        - rtoDetails
        - validationErrors
        - logs
        - policy
        - createdAt
        - updatedAt

    ApplicationInput:
      type: object
      properties:
        providerId:
          type: ["integer", "null"]
        executionMode:
          type: string
          enum: [API, BROWSER, AUTO]
        vehicleDetails:
          $ref: "#/components/schemas/VehicleDetails"
        ownerKyc:
          $ref: "#/components/schemas/OwnerKyc"
        rtoDetails:
          $ref: "#/components/schemas/RtoDetails"
      required:
        - executionMode
        - vehicleDetails
        - ownerKyc
        - rtoDetails

    ApplicationUpdate:
      type: object
      properties:
        providerId:
          type: ["integer", "null"]
        executionMode:
          type: string
          enum: [API, BROWSER, AUTO]
        vehicleDetails:
          $ref: "#/components/schemas/VehicleDetails"
        ownerKyc:
          $ref: "#/components/schemas/OwnerKyc"
        rtoDetails:
          $ref: "#/components/schemas/RtoDetails"

    ExecutionRequest:
      type: object
      properties:
        executionMode:
          type: string
          enum: [API, BROWSER, AUTO]
        confirmedByUser:
          type: boolean
          description: User has reviewed and confirmed the data before submission
      required:
        - confirmedByUser

    ExecutionResult:
      type: object
      properties:
        applicationId:
          type: number
        status:
          type: string
          enum: [submitting, completed, failed]
        resolvedExecutionMode:
          type: string
          enum: [API, BROWSER]
        message:
          type: string
        policy:
          oneOf:
            - $ref: "#/components/schemas/Policy"
            - type: "null"
      required:
        - applicationId
        - status
        - resolvedExecutionMode
        - message
        - policy

    ValidationResult:
      type: object
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
      required:
        - valid
        - errors
        - warnings

    SubmissionLog:
      type: object
      properties:
        id:
          type: number
        applicationId:
          type: number
        step:
          type: string
          enum: [data_ingestion, validation, routing, execution_api, execution_browser, finalization, error, browser_launch, page_loaded, form_vehicle, form_kyc, form_rto, form_submit, policy_issued, browser_error]
        status:
          type: string
          enum: [info, success, warning, error]
        message:
          type: string
        metadata:
          type: ["object", "null"]
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - applicationId
        - step
        - status
        - message
        - metadata
        - createdAt

    Policy:
      type: object
      properties:
        id:
          type: number
        applicationId:
          type: number
        policyNumber:
          type: string
        pdfUrl:
          type: ["string", "null"]
        providerName:
          type: string
        issuedAt:
          type: string
          format: date-time
      required:
        - id
        - applicationId
        - policyNumber
        - pdfUrl
        - providerName
        - issuedAt

    DashboardStats:
      type: object
      properties:
        total:
          type: number
        draft:
          type: number
        submitting:
          type: number
        completed:
          type: number
        failed:
          type: number
        policiesIssued:
          type: number
        providerBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/ProviderStat"
      required:
        - total
        - draft
        - submitting
        - completed
        - failed
        - policiesIssued
        - providerBreakdown

    ProviderStat:
      type: object
      properties:
        providerName:
          type: string
        count:
          type: number
        completed:
          type: number
      required:
        - providerName
        - count
        - completed

    # ── Ingest schemas ──────────────────────────────────────────────────────
    MsaFields:
      type: object
      description: Normalised vehicle + owner + RTO fields for an MSA payload
      properties:
        vehicleMake:
          type: string
        vehicleModel:
          type: string
        vehicleVariant:
          type: string
        vehicleEngineNumber:
          type: string
        vehicleChassisNumber:
          type: string
        vehicleExShowroomPrice:
          type: number
        vehicleDateOfPurchase:
          type: string
          format: date
        ownerFullName:
          type: string
        ownerBillingAddress:
          type: string
        ownerPincode:
          type: number
        ownerPhoneNumber:
          type: string
        ownerEmail:
          type: string
        ownerDateOfBirth:
          type: string
          format: date
        ownerIdProofType:
          type: string
          enum: [AADHAR, PAN, PASSPORT, DRIVING_LICENSE, VOTER_ID]
        ownerIdProofNumber:
          type: string
        rtoRegistrationCity:
          type: string
        rtoRegistrationState:
          type: string
        rtoCode:
          type: string
      required:
        - vehicleMake
        - vehicleModel
        - vehicleVariant
        - vehicleEngineNumber
        - vehicleChassisNumber
        - vehicleExShowroomPrice
        - vehicleDateOfPurchase
        - ownerFullName
        - ownerBillingAddress
        - ownerPincode
        - ownerPhoneNumber
        - ownerEmail
        - ownerDateOfBirth
        - ownerIdProofType
        - ownerIdProofNumber
        - rtoRegistrationCity
        - rtoRegistrationState
        - rtoCode

    IngestResult:
      type: object
      description: Extracted MSA fields from any ingest source
      properties:
        fields:
          $ref: "#/components/schemas/MsaFields"
        confidence:
          type: object
          description: Per-field confidence score 0-1
          additionalProperties:
            type: number
        rawText:
          type: ["string", "null"]
          description: Raw extracted text (OCR/scrape) for display in the review panel
        engineUsed:
          type: ["string", "null"]
          description: OCR engine that actually produced this result. Null for non-OCR sources.
        isDemoData:
          type: boolean
          description: True when the result came from the stub engine and contains fabricated values.
        attempts:
          type: array
          description: Every engine tried, in order, including failures. OCR only.
          items:
            $ref: "#/components/schemas/OcrAttempt"
      required:
        - fields
        - confidence

    DmsPullInput:
      type: object
      properties:
        regNo:
          type: string
          description: Vehicle registration number, e.g. DL01AB1234
          minLength: 1
      required:
        - regNo

    BrowserScrapeInput:
      type: object
      properties:
        url:
          type: string
          description: Dealer portal URL to scrape
          minLength: 1
        username:
          type: ["string", "null"]
          description: Optional login username for the portal
        password:
          type: ["string", "null"]
          description: Optional login password for the portal
      required:
        - url

    OcrInput:
      type: object
      properties:
        imageBase64:
          type: string
          description: Base64-encoded image (JPEG/PNG) or PDF content
        mimeType:
          type: string
          description: MIME type of the uploaded file, e.g. image/jpeg or application/pdf
        model:
          type: string
          enum: [auto, paddleocr, qwen-vl, olmocr, gpt-vision, stub]
          description: >-
            Preferred OCR engine. "auto" (the default) walks the configured
            priority order. Naming an engine puts it first but still falls
            through to the rest unless allowFallback is false. The stub engine is
            never reached automatically — it must be named explicitly.
        allowFallback:
          type: boolean
          description: >-
            When false, only the named engine is tried and its failure is
            returned as-is. Defaults to true. Ignored when model is "auto".
      required:
        - imageBase64
        - mimeType

    OcrAttempt:
      type: object
      description: One engine attempt within a fallback chain
      properties:
        engineId:
          type: string
          enum: [paddleocr, qwen-vl, olmocr, gpt-vision, stub]
        ok:
          type: boolean
        error:
          type: ["string", "null"]
        durationMs:
          type: number
      required:
        - engineId
        - ok
        - error
        - durationMs

    OcrEngineStatus:
      type: object
      description: An OCR engine's configuration and live availability
      properties:
        engineId:
          type: string
          enum: [paddleocr, qwen-vl, olmocr, gpt-vision, stub]
        label:
          type: string
        priority:
          type: number
          description: Lower is tried first
        isEnabled:
          type: boolean
          description: Operator toggle, stored in the database
        isImplemented:
          type: boolean
          description: False for engines that are stubs pending real integration
        isConfigured:
          type: boolean
          description: True when the engine's API key is present in the environment
        isAvailable:
          type: boolean
          description: isEnabled AND isImplemented AND isConfigured
        autoEligible:
          type: boolean
          description: Whether this engine can be selected by the automatic chain
        statusReason:
          type: string
          description: Human-readable explanation of the current status
        requiredEnvVar:
          type: ["string", "null"]
      required:
        - engineId
        - label
        - priority
        - isEnabled
        - isImplemented
        - isConfigured
        - isAvailable
        - autoEligible
        - statusReason
        - requiredEnvVar

    UpdateOcrEnginesInput:
      type: object
      properties:
        engines:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              engineId:
                type: string
                enum: [paddleocr, qwen-vl, olmocr, gpt-vision, stub]
              priority:
                type: number
              isEnabled:
                type: boolean
            required:
              - engineId
              - priority
              - isEnabled
      required:
        - engines

    IngestPushInput:
      type: object
      properties:
        fields:
          $ref: "#/components/schemas/MsaFields"
      required:
        - fields

    IngestPushResult:
      type: object
      properties:
        applicationId:
          type: number
          description: ID of the newly created draft application in InsurRouter
      required:
        - applicationId

    RecentApplication:
      type: object
      properties:
        id:
          type: number
        ownerName:
          type: string
        vehicleMake:
          type: string
        vehicleModel:
          type: string
        providerName:
          type: ["string", "null"]
        status:
          type: string
          enum: [draft, validating, pending_confirmation, submitting, completed, failed]
        executionMode:
          type: string
          enum: [API, BROWSER, AUTO]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - ownerName
        - vehicleMake
        - vehicleModel
        - providerName
        - status
        - executionMode
        - createdAt
